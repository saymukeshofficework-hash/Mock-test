<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ea580c">
<title>School Entrance Exam — TET Test Hub</title>
<style>
:root{color-scheme:light;--ink:#29233b;--muted:#6b6478;--orange:#ea580c;--line:#f2d7c5}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(145deg,#fff7ed,#f8f5ff);font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif;color:var(--ink)}
header{padding:14px 16px;background:#fff;border-bottom:1px solid #eee4da;box-shadow:0 3px 14px #41220c0a}
.head{max-width:900px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:900;color:#30204f}.brand span{color:var(--orange)}
.back{padding:9px 13px;border-radius:10px;background:#fff0e5;color:#9a3412;text-decoration:none;font-size:13px;font-weight:800}
main{max-width:900px;margin:auto;padding:26px 16px 60px}
.kicker{display:inline-block;padding:6px 11px;border-radius:999px;background:#ffedd5;color:#9a3412;font-size:12px;font-weight:900}
h1{margin:14px 0 8px;font-size:clamp(25px,5vw,38px);line-height:1.2}
.intro{margin:0 0 22px;color:var(--muted);line-height:1.7}
.folder{display:flex;align-items:center;gap:15px;padding:18px;border:1px solid var(--line);border-top:5px solid var(--orange);border-radius:18px;background:#fff;box-shadow:0 9px 24px #7c2d1210;text-decoration:none;color:inherit;transition:transform .15s,box-shadow .15s}
.folder:hover{transform:translateY(-2px);box-shadow:0 13px 28px #7c2d1218}
.icon{display:grid;place-items:center;flex:0 0 58px;width:58px;height:58px;border-radius:16px;background:#ffedd5;font-size:30px}
.folder strong{display:block;font-size:18px;color:#9a3412}
.folder small{display:block;margin-top:5px;color:var(--muted);font-size:13px;line-height:1.5}
.arrow{margin-left:auto;color:var(--orange);font-size:28px}
@media(max-width:520px){main{padding:22px 12px}.folder{padding:14px;gap:11px}.icon{flex-basis:48px;width:48px;height:48px;font-size:25px}.folder strong{font-size:15px}.folder small{font-size:11px}}
</style>
</head>
<body>
<header><div class="head"><div class="brand">TET <span>TEST HUB</span></div><a class="back" href="/index.html">← Home</a></div></header>
<main>
<span class="kicker">SCHOOL ENTRANCE EXAM</span>
<h1>School Entrance Exam</h1>
<p class="intro">स्कूल प्रवेश परीक्षाओं की तैयारी के लिए उपलब्ध टेस्ट फोल्डर। नवोदय विद्यालय कक्षा 6 के मॉक टेस्ट यहाँ से खोलें।</p>

</a>
</main>
</body>
</html>
