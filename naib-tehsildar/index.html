<script>
(function () {
  function getLang() {
    try { return localStorage.getItem("tetLang") || localStorage.getItem("testhub_lang_pref") || "en"; }
    catch (e) { return "en"; }
  }
  function chooseLang(value) {
    try { localStorage.setItem("tetLang", value); localStorage.setItem("testhub_lang_pref", value); } catch (e) {}
    document.querySelectorAll("[data-tth-lang]").forEach(function (button) {
      button.classList.toggle("active", button.getAttribute("data-tth-lang") === value);
      button.setAttribute("aria-pressed", String(button.getAttribute("data-tth-lang") === value));
    });
    var questionLang = document.getElementById("qLangSelect");
    var defaultLang = document.getElementById("defaultLang");
    [questionLang, defaultLang].forEach(function (control) {
      if (control && control.value !== value) {
        control.value = value;
        control.dispatchEvent(new Event("change", { bubbles: true }));
      }
    });
    document.dispatchEvent(new CustomEvent("tth:languagechange", { detail: { lang: value } }));
  }
  document.addEventListener("click", function (event) {
    var button = event.target.closest("[data-tth-lang]");
    if (button) chooseLang(button.getAttribute("data-tth-lang"));
  });
  document.addEventListener("DOMContentLoaded", function () { chooseLang(getLang()); }, { once: true });
  chooseLang(getLang());
})();
</script>
