<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TET Mock Tests</title>
<meta name="description" content="Practice with carefully prepared TET (Teacher Eligibility Test) mock tests — free online full-length tests with instant results.">
<style>
  :root{
    --blue:#2b5aa7; --blue-dark:#1e3f7a; --green:#3fa142; --red:#d9534f;
    --grey:#9e9e9e; --purple:#7b3fa0; --lightblue:#eaf1fb; --border:#d7dde5;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:Arial,Segoe UI,Helvetica,sans-serif;background:#f2f4f7;color:#222;}
  a{color:inherit;}

  header.topbar{background:var(--blue-dark);color:#fff;padding:10px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
  header.topbar .brand{font-size:17px;font-weight:700;letter-spacing:.2px;}
  header.topbar nav{display:flex;gap:6px;flex-wrap:wrap;}
  header.topbar nav a{color:#fff;text-decoration:none;font-size:13px;font-weight:600;padding:6px 12px;border-radius:4px;background:rgba(255,255,255,.12);}
  header.topbar nav a.active{background:#fff;color:var(--blue-dark);}
  header.topbar nav a:hover:not(.active){background:rgba(255,255,255,.25);}

  main{max-width:1200px;margin:0 auto;padding:0 16px;}

  .hero{text-align:center;padding:36px 16px 24px;}
  .hero h1{margin:0 0 8px;font-size:28px;color:var(--blue-dark);}
  .hero p{margin:0;font-size:15px;color:#555;}

  .test-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px;padding:8px 0 40px;}

  .test-card{background:#fff;border:1px solid var(--border);border-radius:8px;padding:18px;display:flex;flex-direction:column;box-shadow:0 1px 3px rgba(0,0,0,.05);transition:box-shadow .15s,transform .15s;}
  .test-card:hover{box-shadow:0 4px 12px rgba(0,0,0,.1);transform:translateY(-2px);}
  .test-card h2{margin:0 0 6px;font-size:16px;color:var(--blue-dark);}
  .test-card .desc{font-size:13px;color:#666;margin:0 0 12px;}
  .test-card .meta{font-size:12px;color:var(--blue);background:var(--lightblue);display:inline-block;padding:3px 8px;border-radius:4px;margin-bottom:16px;align-self:flex-start;}
  .test-card .start-btn{margin-top:auto;display:block;text-align:center;background:var(--blue);color:#fff;text-decoration:none;font-weight:600;font-size:14px;padding:10px 14px;border-radius:5px;border:1px solid var(--blue);}
  .test-card .start-btn:hover{background:var(--blue-dark);border-color:var(--blue-dark);}

  .more-note{text-align:center;font-size:13px;color:#888;padding:0 16px 40px;}

  footer{text-align:center;font-size:12px;color:#888;padding:16px;border-top:1px solid var(--border);background:#fff;}

  @media(max-width:480px){
    header.topbar{justify-content:center;text-align:center;}
    .hero h1{font-size:22px;}
  }
</style>
</head>
<body>

  <header class="topbar">
    <div class="brand">TET Mock Tests</div>
    <nav>
      <a href="index.html" class="active">Home</a>
    </nav>
  </header>

  <main>
    <div class="hero">
      <h1>TET Mock Tests</h1>
      <p>Practice with 20 carefully prepared mock tests</p>
    </div>

    <div class="test-grid" id="testGrid"></div>
    <p class="more-note" id="moreNote"></p>
  </main>

  <footer>TET Mock Tests &mdash; free practice tests for Teacher Eligibility Test aspirants.</footer>

<script>
  /*
   * List every published TET mock test here. Each entry needs:
   *   id        - test number, used for the card title
   *   file      - the existing test page's filename (relative to this page)
   *   questions - question count shown on the card (must match the test page)
   *   desc      - short description shown on the card
   *
   * To publish a new test: create its page, then add one object below.
   * The grid always shows exactly the tests listed here — nothing is
   * guessed or linked until its page actually exists.
   */
  const TOTAL_PLANNED_TESTS = 20;

  const tests = [
    { id: 1, file: "tet-mock-test-1.html", questions: 150, desc: "Practice Test" },
    { id: 2, file: "tet-mock-test-2.html", questions: 150, desc: "Practice Test" },
    { id: 3, file: "tet-mock-test-3.html", questions: 150, desc: "Practice Test" },
    { id: 4, file: "tet-mock-test-4.html", questions: 150, desc: "Practice Test" },
    { id: 5, file: "tet-mock-test-5.html", questions: 150, desc: "Practice Test" },
    { id: 6, file: "tet-mock-test-6.html", questions: 150, desc: "Practice Test" },
    { id: 7, file: "tet-mock-test-7.html", questions: 150, desc: "Practice Test" },
    { id: 8, file: "tet-mock-test-8.html", questions: 150, desc: "Practice Test" },
    { id: 9, file: "tet-mock-test-9.html", questions: 150, desc: "Practice Test" },
    { id: 10, file: "tet-mock-test-10.html", questions: 150, desc: "Practice Test" },
    { id: 11, file: "tet-mock-test-11.html", questions: 150, desc: "Practice Test" },
    { id: 12, file: "tet-mock-test-12.html", questions: 150, desc: "Practice Test" },
    { id: 13, file: "tet-mock-test-13.html", questions: 150, desc: "Practice Test" },
    { id: 14, file: "tet-mock-test-14.html", questions: 150, desc: "Practice Test" },
    { id: 15, file: "tet-mock-test-15.html", questions: 150, desc: "Practice Test" },
    { id: 16, file: "tet-mock-test-16.html", questions: 150, desc: "Practice Test" },
    { id: 17, file: "tet-mock-test-17.html", questions: 150, desc: "Practice Test" },
    { id: 18, file: "tet-mock-test-18.html", questions: 150, desc: "Practice Test" },
    { id: 19, file: "tet-mock-test-19.html", questions: 150, desc: "Practice Test" },
    { id: 20, file: "tet-mock-test-20.html", questions: 150, desc: "Practice Test" },
  ];

  const grid = document.getElementById('testGrid');
  tests.forEach(t => {
    const card = document.createElement('div');
    card.className = 'test-card';
    card.innerHTML = `
      <h2>TET Mock Test ${t.id}</h2>
      <p class="desc">${t.desc}</p>
      <span class="meta">${t.questions} Questions</span>
      <a class="start-btn" href="${t.file}">Start Test</a>
    `;
    grid.appendChild(card);
  });

  const remaining = TOTAL_PLANNED_TESTS - tests.length;
  if (remaining > 0) {
    document.getElementById('moreNote').textContent =
      `${remaining} more mock test${remaining === 1 ? '' : 's'} will be added soon.`;
  }
</script>
</body>
</html>
