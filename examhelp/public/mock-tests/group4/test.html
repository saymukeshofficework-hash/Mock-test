<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MPESB Group-4 Mock Test 1 | TET TestHub</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5fb;color:#17213b;font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif}header{background:#253b80;color:white;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}header b{font-size:18px}button{cursor:pointer;border:0;border-radius:9px;padding:10px 14px;font-weight:700}.lang{background:#fff;color:#253b80}.wrap{max-width:850px;margin:18px auto;padding:0 12px}.panel{background:white;border:1px solid #dfe4f0;border-radius:16px;padding:18px;box-shadow:0 5px 20px #1b2a5010}.meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:#4c5a7c;font-weight:700}.progress{height:7px;background:#e8ecf5;border-radius:8px;margin:14px 0;overflow:hidden}.progress span{display:block;height:100%;background:#4569d4;width:1%}h2{font-size:20px;line-height:1.55}.opts{display:grid;gap:10px}.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:#f8f9fd;border:1px solid #dfe4f0;color:#17213b;width:100%;padding:13px;border-radius:10px;font-size:16px}.opt.sel{background:#eaf0ff;border-color:#4569d4}.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.primary{background:#3158c9;color:#fff}.secondary{background:#e9edf7;color:#253b80}.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:16px}.grid button{padding:8px 0;background:#edf0f7;color:#253b80}.grid button.done{background:#16875f;color:#fff}.grid button.active{outline:2px solid #253b80}.muted{color:#65708b;font-size:13px}.hide{display:none}@media(max-width:520px){.grid{grid-template-columns:repeat(8,1fr)}h2{font-size:18px}}
</style></head><body><header><b>TET TESTHUB · MPESB GROUP-4</b><button class="lang" id="lang">English</button></header><div class="wrap"><div class="panel" id="app"><div class="meta"><span id="testtitle">टेस्ट 1</span><span id="counter">प्रश्न 1 / 100</span><span>120:00</span></div><div class="progress"><span id="bar"></span></div><div class="muted" id="section"></div><h2 id="question">प्रश्न लोड हो रहा है…</h2><div class="opts" id="options"></div><div class="nav"><button class="secondary" id="prev">पिछला</button><button class="primary" id="next">अगला</button></div><div class="grid" id="palette"></div><p class="muted">उत्तर चुनने के बाद हरे प्रश्न नंबर से स्थिति दिखेगी। सबमिट करने पर परिणाम और उत्तर-कुंजी दिखाई जाएगी।</p><button class="primary" id="submit" style="width:100%">टेस्ट सबमिट करें</button></div><div class="panel hide" id="result"></div></div>
<script>
let data,lang='hi',idx=0,answers={};const $=id=>document.getElementById(id);
const txt=(o)=>o?.[lang]??o?.hi??'';async function init(){try{let r=await fetch('/examhelp/mock-tests/group4/tests/01.json');if(!r.ok)throw Error('लोड नहीं हुआ');data=await r.json();$('testtitle').textContent=txt(data.title);draw()}catch(e){$('question').textContent='प्रश्नपत्र लोड नहीं हो पाया। कृपया पेज रीफ्रेश करें।'}}
function draw(){let q=data.questions[idx];$('counter').textContent=(lang==='hi'?'प्रश्न ':'Question ')+(idx+1)+' / '+data.questions.length;$('bar').style.width=((idx+1)/data.questions.length*100)+'%';let s=data.sections.find(x=>x.key===q.s);$('section').textContent=txt(s?.label);$('question').textContent=txt(q.q);$('options').innerHTML='';q.o[lang].forEach((v,n)=>{let b=document.createElement('button');b.className='opt'+(answers[idx]===n?' sel':'');b.textContent=String.fromCharCode(65+n)+'. '+v;b.onclick=()=>{answers[idx]=n;draw()};$('options').appendChild(b)});$('prev').disabled=idx===0;$('next').textContent=idx===data.questions.length-1?(lang==='hi'?'अंतिम प्रश्न':'Last question'):(lang==='hi'?'अगला':'Next');$('palette').innerHTML='';data.questions.forEach((_,n)=>{let b=document.createElement('button');b.textContent=n+1;b.className=(answers[n]!==undefined?'done ':'')+(n===idx?'active':'');b.onclick=()=>{idx=n;draw()};$('palette').appendChild(b)});$('prev').textContent=lang==='hi'?'पिछला':'Previous';$('submit').textContent=lang==='hi'?'टेस्ट सबमिट करें':'Submit test'}
$('prev').onclick=()=>{idx=Math.max(0,idx-1);draw()};$('next').onclick=()=>{idx=Math.min(data.questions.length-1,idx+1);draw()};$('lang').onclick=()=>{lang=lang==='hi'?'en':'hi';$('lang').textContent=lang==='hi'?'English':'हिंदी';draw()};$('submit').onclick=()=>{let score=0;data.questions.forEach((q,n)=>{if(answers[n]===q.a)score++});$('app').classList.add('hide');$('result').classList.remove('hide');$('result').innerHTML='<h2>'+(lang==='hi'?'आपका परिणाम':'Your Result')+'</h2><p style="font-size:28px;font-weight:800">'+score+' / '+data.questions.length+'</p><p>'+(lang==='hi'?'सही उत्तर':'Correct answers')+': '+score+' · '+(lang==='hi'?'अनुत्तरित':'Unanswered')+': '+(data.questions.length-Object.keys(answers).length)+'</p><h3>'+(lang==='hi'?'उत्तर-कुंजी':'Answer key')+'</h3>'+data.questions.map((q,n)=>'<p><b>'+(n+1)+'. '+String.fromCharCode(65+q.a)+'</b> — '+txt(q.sol)+'</p>').join('')+'<button onclick="location.reload()" class="primary">रीस्टार्ट / Restart</button>'};
init();
</script></body></html>
