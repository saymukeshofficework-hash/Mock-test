<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Current Affairs — TET Test Hub</title>
<meta name="description" content="Daily Current Affairs और Current Affairs E-book के लिए अध्ययन फोल्डर।">
<meta name="theme-color" content="#171225">
<style>
:root{color-scheme:dark;--bg:#100d19;--panel:#1b1628;--line:#342747;--ink:#f7f3ff;--muted:#b7adc9;--purple:#a78bfa}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#2b1c49 0%,var(--bg) 55%);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif;min-height:100vh}
header{position:sticky;top:0;background:#100d19eF;border-bottom:1px solid var(--line);backdrop-filter:blur(12px);padding:14px 18px;z-index:2}
.header-inner{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:900;letter-spacing:.3px}.brand span{color:var(--purple)}.back{color:#fff;background:#302344;border:1px solid #49345f;border-radius:10px;padding:9px 13px;text-decoration:none;font-weight:750;font-size:13px}
main{max-width:1100px;margin:0 auto;padding:28px 16px 100px}
.eyebrow{display:inline-block;color:#d8c8ff;background:#35244e;border:1px solid #50376f;border-radius:999px;padding:6px 10px;font-size:11px;font-weight:900;letter-spacing:.5px}
h1{font-size:clamp(25px,4vw,38px);margin:14px 0 8px;line-height:1.2}.intro{color:var(--muted);margin:0 0 24px;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{--accent:#b45309;display:flex;align-items:center;gap:13px;min-width:0;min-height:112px;padding:16px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(135deg,var(--panel),#211a30);color:var(--ink);text-decoration:none;box-shadow:0 8px 24px #0002;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-3px);border-color:var(--accent)}.icon{display:grid;place-items:center;flex:0 0 50px;height:50px;border-radius:14px;background:var(--icon-bg,#fef3c7);color:var(--icon-color,#b45309);font-size:25px}
.card strong{display:block;font-size:15px;line-height:1.4}.card small{display:block;color:var(--muted);font-size:11px;line-height:1.5;margin-top:4px}.arrow{margin-left:auto;color:var(--accent);font-size:24px}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{padding:12px;gap:9px;min-height:100px}.icon{flex-basis:40px;height:40px;font-size:21px}.card strong{font-size:13px}.card small{font-size:10px}}
@media(max-width:380px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="header-inner"><div class="brand">TET <span>TEST HUB</span></div><a class="back" href="/index.html">← Home</a></div></header>
<main>
<span class="eyebrow">CURRENT AFFAIRS · STUDY FOLDER</span>
<h1>Current Affairs</h1>
<p class="intro">करेंट अफेयर्स की तैयारी के लिए नीचे दिए गए विकल्प खोलें।</p>
<div class="grid">
<a class="card" style="--accent:#f59e0b;--icon-bg:#fef3c7;--icon-color:#b45309" href="/examhelp/current-affairs/"><span class="icon">📰</span><span><strong>Daily Current Affairs</strong><small>Daily updates · Free practice · Quiz</small></span><span class="arrow">›</span></a>
<a class="card" style="--accent:#38bdf8;--icon-bg:#dbeafe;--icon-color:#1d4ed8" href="/current-affairs-ebook.html"><span class="icon">📚</span><span><strong>Current Affairs E-book</strong><small>Hindi &amp; English PDF study material</small></span><span class="arrow">›</span></a>
</div>
</main>
</body>
</html>
