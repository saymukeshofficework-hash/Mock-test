<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get Started — BBC English Coaching Classes Burhar</title>
<meta name="description" content="Tell us your name and your English learning goal to get a personalised daily practice plan.">
<meta name="theme-color" content="#1e3a5f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="onboarding">
<a class="skip-link" href="#main">Skip to content</a>
<header class="app-header">
  <div class="container">
    <a class="brand" href="index.html">
      <span class="brand-mark">BE</span>
      <span class="brand-text"><strong>BBC English Coaching</strong><span>Classes Burhar</span></span>
    </a>
    <div class="header-stats">
      <button class="icon-btn" data-theme-toggle aria-pressed="false" aria-label="Switch to dark mode">🌙</button>
    </div>
  </div>
</header>

<main id="main" class="container section" style="max-width:640px;">
  <div id="step-name">
    <span class="eyebrow" style="color:var(--accent);font-weight:700;text-transform:uppercase;font-size:0.75rem;">Step 1 of 2</span>
    <h1>What's your name?</h1>
    <p class="text-muted">We'll use this to personalise your dashboard. Nothing is uploaded — it stays on this device.</p>
    <div class="field">
      <label for="student-name">Your name</label>
      <input type="text" id="student-name" placeholder="e.g. Aman Kumar" autocomplete="given-name">
    </div>
    <button class="btn btn-primary btn-block" id="to-step-2">Continue</button>
  </div>

  <div id="step-goal" hidden>
    <span class="eyebrow" style="color:var(--accent);font-weight:700;text-transform:uppercase;font-size:0.75rem;">Step 2 of 2</span>
    <h1>What's your goal?</h1>
    <p class="text-muted">Pick the one that matters most right now — you can change this any time.</p>
    <div class="choice-grid" id="goal-grid">
      <button class="choice-btn" data-goal="spoken">🗣️ Spoken English</button>
      <button class="choice-btn" data-goal="school">🏫 School English</button>
      <button class="choice-btn" data-goal="grammar">🧠 Grammar</button>
      <button class="choice-btn" data-goal="vocabulary">📚 Vocabulary</button>
      <button class="choice-btn" data-goal="interview">💼 Interview English</button>
      <button class="choice-btn" data-goal="competitive">🎯 Competitive Exams</button>
      <button class="choice-btn" data-goal="overall">🌟 Overall English</button>
    </div>
    <button class="btn btn-primary btn-block" id="finish-onboarding" disabled>Start My Journey</button>
  </div>
</main>

<script src="js/config.js"></script>
<script src="js/storage.js"></script>
<script src="js/progress.js"></script>
<script src="js/gamification.js"></script>
<script>
  let selectedGoal = null;
  document.getElementById("to-step-2").addEventListener("click", () => {
    const name = document.getElementById("student-name").value.trim();
    document.getElementById("step-name").hidden = true;
    document.getElementById("step-goal").hidden = false;
    window._onboardName = name || "Student";
  });
  document.querySelectorAll("#goal-grid .choice-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("#goal-grid .choice-btn").forEach((b) => b.classList.remove("selected"));
      btn.classList.add("selected");
      selectedGoal = btn.dataset.goal;
      document.getElementById("finish-onboarding").disabled = false;
    });
  });
  document.getElementById("finish-onboarding").addEventListener("click", () => {
    Progress.saveProfile({ name: window._onboardName || "Student", goal: selectedGoal, createdAt: new Date().toISOString() });
    Progress.touchStreak();
    window.location.href = "progress.html";
  });
</script>
<script src="js/app.js"></script>
</body>
</html>
