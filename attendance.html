<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Attendance</title>
<style>
  :root {
    --navy: #1E2761;
    --ice: #CADCFC;
    --white: #FFFFFF;
    --text: #212121;
    --muted: #6b7280;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--white);
    font-family: Calibri, Arial, sans-serif;
    color: var(--text);
  }
  .page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 32px 28px 8px;
  }
  h1 {
    margin: 0;
    font-size: 28px;
    font-weight: 700;
    color: var(--navy);
  }
  .subtitle {
    margin-top: 4px;
    font-size: 13px;
    color: var(--muted);
  }
  .list {
    flex: 1;
    padding: 12px 20px 100px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 4px 24px;
    max-width: 1000px;
    margin: 0 auto;
    width: 100%;
  }
  .row {
    display: flex;
    align-items: center;
    padding: 10px 8px;
    border-bottom: 1px solid #eef0f5;
  }
  .avatar {
    width: 36px;
    height: 36px;
    min-width: 36px;
    border-radius: 50%;
    background: var(--ice);
    border: 1.5px solid var(--navy);
    color: var(--navy);
    font-weight: 700;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-right: 12px;
  }
  .name {
    flex: 1;
    font-size: 15px;
  }
  .switch {
    position: relative;
    width: 46px;
    height: 24px;
    flex-shrink: 0;
    cursor: pointer;
  }
  .switch input {
    opacity: 0;
    width: 0;
    height: 0;
  }
  .track {
    position: absolute;
    inset: 0;
    background: #d5d8e2;
    border-radius: 999px;
    transition: background 0.2s ease;
  }
  .knob {
    position: absolute;
    top: 3px;
    left: 3px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--white);
    box-shadow: 0 1px 2px rgba(0,0,0,0.25);
    transition: transform 0.2s ease;
  }
  input:checked ~ .track {
    background: var(--navy);
  }
  input:checked ~ .track .knob {
    transform: translateX(22px);
  }
  footer {
    position: sticky;
    bottom: 0;
    width: 100%;
    background: var(--navy);
    color: var(--white);
    text-align: center;
    padding: 22px 16px;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.3px;
  }
  footer .sub {
    font-size: 12px;
    font-weight: 400;
    opacity: 0.8;
    margin-top: 2px;
  }
</style>
</head>
<body>
  <div class="page">
    <header>
      <h1>Attendance</h1>
      <div class="subtitle">Tap a switch to mark present / absent</div>
    </header>

    <div class="list" id="list"></div>

    <footer>
      <div id="count">Present: 14 / 14</div>
      <div class="sub">Tap names to toggle attendance</div>
    </footer>
  </div>

<script>
  const names = ["APraveen","Kiran","Monu","Divyansh","Manish","Prakash","Dhansingh","Vikas","Shanti","Radhika","Radhika Singh","Lakshmi","Ruchi","Vibha"];

  const state = {};
  names.forEach(n => state[n] = true); // default: all present

  const listEl = document.getElementById("list");
  const countEl = document.getElementById("count");

  function updateCount() {
    const present = Object.values(state).filter(Boolean).length;
    countEl.textContent = `Present: ${present} / ${names.length}`;
  }

  names.forEach(name => {
    const row = document.createElement("div");
    row.className = "row";

    const initial = name.trim()[0].toUpperCase();

    row.innerHTML = `
      <div class="avatar">${initial}</div>
      <div class="name">${name}</div>
      <label class="switch">
        <input type="checkbox" checked data-name="${name}">
        <span class="track"><span class="knob"></span></span>
      </label>
    `;

    const checkbox = row.querySelector("input");
    checkbox.addEventListener("change", (e) => {
      state[name] = e.target.checked;
      updateCount();
    });

    listEl.appendChild(row);
  });

  updateCount();
</script>
</body>
</html>
