<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Attendance</title>
<style>
  :root {
    --navy: #1E2761;
    --ice: #CADCFC;
    --white: #FFFFFF;
    --text: #212121;
    --muted: #6b7280;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--white);
    font-family: Calibri, Arial, sans-serif;
    color: var(--text);
  }
  .page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 32px 28px 8px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
  }
  h1 {
    margin: 0;
    font-size: 28px;
    font-weight: 700;
    color: var(--navy);
  }
  .subtitle {
    margin-top: 4px;
    font-size: 13px;
    color: var(--muted);
  }
  .pdf-btn {
    flex-shrink: 0;
    margin-top: 4px;
    padding: 10px 18px;
    border: none;
    border-radius: 999px;
    background: var(--navy);
    color: var(--white);
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .pdf-btn:hover {
    opacity: 0.9;
  }
  .print-status {
    display: none;
  }
  .list {
    flex: 1;
    padding: 12px 20px 100px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px 24px;
    align-items: start;
    max-width: 1000px;
    margin: 0 auto;
    width: 100%;
  }
  .group-title {
    margin: 0 0 4px;
    padding: 4px 8px;
    font-size: 14px;
    font-weight: 700;
    color: var(--navy);
  }
  .row {
    display: flex;
    align-items: center;
    padding: 10px 8px;
    border-bottom: 1px solid #eef0f5;
  }
  .avatar {
    width: 36px;
    height: 36px;
    min-width: 36px;
    border-radius: 50%;
    background: var(--ice);
    border: 1.5px solid var(--navy);
    color: var(--navy);
    font-weight: 700;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-right: 12px;
  }
  .name {
    flex: 1;
    font-size: 15px;
  }
  .toggles {
    display: flex;
    gap: 16px;
    flex-shrink: 0;
  }
  .toggle-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
  }
  .toggle-label {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.3px;
    text-transform: uppercase;
    color: var(--muted);
  }
  .switch {
    position: relative;
    width: 46px;
    height: 24px;
    flex-shrink: 0;
    cursor: pointer;
  }
  .switch input {
    opacity: 0;
    width: 0;
    height: 0;
  }
  .track {
    position: absolute;
    inset: 0;
    background: #d5d8e2;
    border-radius: 999px;
    transition: background 0.2s ease;
  }
  .knob {
    position: absolute;
    top: 3px;
    left: 3px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--white);
    box-shadow: 0 1px 2px rgba(0,0,0,0.25);
    transition: transform 0.2s ease;
  }
  input:checked ~ .track .knob {
    transform: translateX(22px);
  }
  .switch.blue input:checked ~ .track {
    background: #2563eb;
  }
  .switch.red input:checked ~ .track {
    background: #dc2626;
  }
  footer {
    position: sticky;
    bottom: 0;
    width: 100%;
    background: var(--navy);
    color: var(--white);
    text-align: center;
    padding: 22px 16px;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.3px;
  }
  footer .sub {
    font-size: 12px;
    font-weight: 400;
    opacity: 0.8;
    margin-top: 2px;
  }
  @media print {
    .pdf-btn {
      display: none;
    }
    .toggles {
      display: none;
    }
    .print-status {
      display: inline;
      font-size: 12px;
      font-weight: 700;
    }
    .row {
      break-inside: avoid;
    }
    footer {
      position: static;
      background: none;
      color: var(--text);
      border-top: 2px solid var(--navy);
    }
  }
</style>
</head>
<body>
  <div class="page">
    <header>
      <div>
        <h1>Attendance</h1>
        <div class="subtitle">Blue = present, red = pencil taken</div>
      </div>
      <button class="pdf-btn" id="downloadPdf" type="button">Download PDF</button>
    </header>

    <div class="list" id="list"></div>

    <footer>
      <div id="count">Present: 18 / 18 &nbsp;·&nbsp; Pencil taken: 0 / 18</div>
      <div class="sub">Tap a switch to toggle</div>
    </footer>
  </div>

<script>
  const classes = [
    { className: "Class I", students: ["Laxmi Pradhan", "Mahi Singh", "Prakash Singh", "Radhika Singh"] },
    { className: "Class II", students: ["Divyansh Pradhan", "Kiran Pradhan", "Mahima Pradhan", "Praveen Singh Maravi", "Radhika Pradhan", "Rakhi Pradhan", "Sunidhi Pradhan"] },
    { className: "Class III", students: ["Divyansh Pradhan", "Monu Singh", "Ruchi Pradhan", "Vikash Singh"] },
    { className: "Class IV", students: ["Dhyan Singh"] },
    { className: "Class V", students: ["Shanti Pradhan", "Vibha Pradhan"] },
  ];

  const state = {};
  let total = 0;
  classes.forEach(g => g.students.forEach((name, i) => {
    state[`${g.className}-${i}`] = { present: true, pencil: false };
    total++;
  }));

  const listEl = document.getElementById("list");
  const countEl = document.getElementById("count");

  function updateCount() {
    const present = Object.values(state).filter(s => s.present).length;
    const pencil = Object.values(state).filter(s => s.pencil).length;
    countEl.textContent = `Present: ${present} / ${total} · Pencil taken: ${pencil} / ${total}`;
  }

  classes.forEach(g => {
    const group = document.createElement("div");
    group.className = "group";

    const title = document.createElement("h2");
    title.className = "group-title";
    title.textContent = g.className;
    group.appendChild(title);

    g.students.forEach((name, i) => {
      const key = `${g.className}-${i}`;
      const row = document.createElement("div");
      row.className = "row";

      const initial = name.trim()[0].toUpperCase();

      row.innerHTML = `
        <div class="avatar">${initial}</div>
        <div class="name">${name}</div>
        <div class="toggles">
          <div class="toggle-group">
            <span class="toggle-label">Present</span>
            <label class="switch blue">
              <input type="checkbox" checked data-key="${key}" data-type="present">
              <span class="track"><span class="knob"></span></span>
            </label>
          </div>
          <div class="toggle-group">
            <span class="toggle-label">Pencil</span>
            <label class="switch red">
              <input type="checkbox" data-key="${key}" data-type="pencil">
              <span class="track"><span class="knob"></span></span>
            </label>
          </div>
        </div>
        <span class="print-status"></span>
      `;

      const printStatus = row.querySelector(".print-status");

      function refreshPrintStatus() {
        const s = state[key];
        printStatus.textContent = `${s.present ? "Present" : "Absent"} · Pencil: ${s.pencil ? "Yes" : "No"}`;
      }

      row.querySelectorAll("input").forEach(checkbox => {
        checkbox.addEventListener("change", (e) => {
          state[key][e.target.dataset.type] = e.target.checked;
          updateCount();
          refreshPrintStatus();
        });
      });

      refreshPrintStatus();
      group.appendChild(row);
    });

    listEl.appendChild(group);
  });

  updateCount();

  document.getElementById("downloadPdf").addEventListener("click", () => {
    window.print();
  });
</script>
</body>
</html>
