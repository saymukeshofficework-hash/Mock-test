<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Attendance</title>
<style>
  :root {
    --navy: #1E2761;
    --ice: #CADCFC;
    --white: #FFFFFF;
    --text: #212121;
    --muted: #6b7280;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--white);
    font-family: Calibri, Arial, sans-serif;
    color: var(--text);
  }
  .page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 32px 28px 8px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
  }
  h1 {
    margin: 0;
    font-size: 28px;
    font-weight: 700;
    color: var(--navy);
  }
  .subtitle {
    margin-top: 4px;
    font-size: 13px;
    color: var(--muted);
  }
  .pdf-btn {
    flex-shrink: 0;
    margin-top: 4px;
    padding: 10px 18px;
    border: none;
    border-radius: 999px;
    background: var(--navy);
    color: var(--white);
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .pdf-btn:hover {
    opacity: 0.9;
  }
  .pdf-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }
  .btn-group {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
    flex-shrink: 0;
  }
  .save-btn {
    background: #16a34a;
  }
  .save-status {
    font-size: 11px;
    color: var(--muted);
    min-height: 14px;
  }
  .list {
    flex: 1;
    padding: 12px 20px 100px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px 24px;
    align-items: start;
    max-width: 1000px;
    margin: 0 auto;
    width: 100%;
  }
  .group-title {
    margin: 0 0 4px;
    padding: 4px 8px;
    font-size: 14px;
    font-weight: 700;
    color: var(--navy);
  }
  .row {
    display: flex;
    align-items: center;
    padding: 10px 8px;
    border-bottom: 1px solid #eef0f5;
  }
  .avatar {
    width: 36px;
    height: 36px;
    min-width: 36px;
    border-radius: 50%;
    background: var(--ice);
    border: 1.5px solid var(--navy);
    color: var(--navy);
    font-weight: 700;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-right: 12px;
  }
  .name {
    flex: 1;
    font-size: 15px;
  }
  .toggles {
    display: flex;
    gap: 16px;
    flex-shrink: 0;
  }
  .toggle-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
  }
  .toggle-label {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.3px;
    text-transform: uppercase;
    color: var(--muted);
  }
  .switch {
    position: relative;
    width: 46px;
    height: 24px;
    flex-shrink: 0;
    cursor: pointer;
  }
  .switch input {
    opacity: 0;
    width: 0;
    height: 0;
  }
  .track {
    position: absolute;
    inset: 0;
    background: #d5d8e2;
    border-radius: 999px;
    transition: background 0.2s ease;
  }
  .knob {
    position: absolute;
    top: 3px;
    left: 3px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--white);
    box-shadow: 0 1px 2px rgba(0,0,0,0.25);
    transition: transform 0.2s ease;
  }
  input:checked ~ .track .knob {
    transform: translateX(22px);
  }
  .switch.blue input:checked ~ .track {
    background: #2563eb;
  }
  .switch.red input:checked ~ .track {
    background: #dc2626;
  }
  footer {
    position: sticky;
    bottom: 0;
    width: 100%;
    background: var(--navy);
    color: var(--white);
    text-align: center;
    padding: 22px 16px;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.3px;
  }
  footer .sub {
    font-size: 12px;
    font-weight: 400;
    opacity: 0.8;
    margin-top: 2px;
  }
  .pdf-exporting .knob {
    box-shadow: none !important;
  }
  .pdf-exporting .btn-group {
    display: none;
  }
  .pdf-exporting footer {
    position: static;
  }
</style>
</head>
<body>
  <div class="page">
    <header>
      <div>
        <h1>Attendance</h1>
        <div class="subtitle">Blue = present, red = pencil taken</div>
      </div>
      <div class="btn-group">
        <button class="pdf-btn save-btn" id="saveBtn" type="button">Save</button>
        <button class="pdf-btn" id="downloadPdf" type="button">Download PDF</button>
        <div class="save-status" id="saveStatus"></div>
      </div>
    </header>

    <div class="list" id="list"></div>

    <footer>
      <div id="count">Present: 18 / 18 &nbsp;·&nbsp; Pencil taken: 0 / 18</div>
      <div class="sub">Tap a switch to toggle</div>
    </footer>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
  const classes = [
    { className: "Class I", students: ["Laxmi Pradhan", "Mahi Singh", "Prakash Singh", "Radhika Singh"] },
    { className: "Class II", students: ["Divyansh Pradhan", "Kiran Pradhan", "Mahima Pradhan", "Praveen Singh Maravi", "Radhika Pradhan", "Rakhi Pradhan", "Sunidhi Pradhan"] },
    { className: "Class III", students: ["Divyansh Pradhan", "Monu Singh", "Ruchi Pradhan", "Vikash Singh"] },
    { className: "Class IV", students: ["Dhyan Singh"] },
    { className: "Class V", students: ["Shanti Pradhan", "Vibha Pradhan"] },
  ];

  const STORAGE_KEY = "attendance-state-v1";

  function loadSavedState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (err) {
      return null;
    }
  }

  const savedState = loadSavedState();

  const state = {};
  let total = 0;
  classes.forEach(g => g.students.forEach((name, i) => {
    const key = `${g.className}-${i}`;
    const saved = savedState && savedState[key];
    state[key] = {
      present: saved ? !!saved.present : true,
      pencil: saved ? !!saved.pencil : false,
    };
    total++;
  }));

  const listEl = document.getElementById("list");
  const countEl = document.getElementById("count");

  function updateCount() {
    const present = Object.values(state).filter(s => s.present).length;
    const pencil = Object.values(state).filter(s => s.pencil).length;
    countEl.textContent = `Present: ${present} / ${total} · Pencil taken: ${pencil} / ${total}`;
  }

  classes.forEach(g => {
    const group = document.createElement("div");
    group.className = "group";

    const title = document.createElement("h2");
    title.className = "group-title";
    title.textContent = g.className;
    group.appendChild(title);

    g.students.forEach((name, i) => {
      const key = `${g.className}-${i}`;
      const row = document.createElement("div");
      row.className = "row";

      const initial = name.trim()[0].toUpperCase();
      const presentChecked = state[key].present ? "checked" : "";
      const pencilChecked = state[key].pencil ? "checked" : "";

      row.innerHTML = `
        <div class="avatar">${initial}</div>
        <div class="name">${name}</div>
        <div class="toggles">
          <div class="toggle-group">
            <span class="toggle-label">Present</span>
            <label class="switch blue">
              <input type="checkbox" ${presentChecked} data-key="${key}" data-type="present">
              <span class="track"><span class="knob"></span></span>
            </label>
          </div>
          <div class="toggle-group">
            <span class="toggle-label">Pencil</span>
            <label class="switch red">
              <input type="checkbox" ${pencilChecked} data-key="${key}" data-type="pencil">
              <span class="track"><span class="knob"></span></span>
            </label>
          </div>
        </div>
      `;

      row.querySelectorAll("input").forEach(checkbox => {
        checkbox.addEventListener("change", (e) => {
          state[key][e.target.dataset.type] = e.target.checked;
          updateCount();
        });
      });

      group.appendChild(row);
    });

    listEl.appendChild(group);
  });

  updateCount();

  const A4_WIDTH_MM = 210;
  const A4_HEIGHT_MM = 297;
  const SETTLE_DELAY_MS = 200;

  async function exportPdf() {
    const btn = document.getElementById("downloadPdf");
    const originalLabel = btn.textContent;

    if (typeof html2canvas === "undefined" || typeof window.jspdf === "undefined") {
      alert("PDF export isn't available right now: the html2canvas/jsPDF libraries failed to load from the CDN. Check your connection and reload the page.");
      return;
    }

    const target = document.querySelector(".page");
    if (!target) return;

    const { jsPDF } = window.jspdf;
    const originalScrollX = window.scrollX;
    const originalScrollY = window.scrollY;

    btn.disabled = true;
    document.body.classList.add("pdf-exporting");

    const CAPTURE_WIDTH_PX = 1000;
    const prevWidth = target.style.width;
    const prevMaxWidth = target.style.maxWidth;

    try {
      await document.fonts.ready;

      // Force a fixed desktop-equivalent width so the class grid lays out
      // in multiple columns and pagination doesn't depend on the viewer's
      // (possibly narrow/mobile) window width.
      target.style.width = CAPTURE_WIDTH_PX + "px";
      target.style.maxWidth = CAPTURE_WIDTH_PX + "px";

      target.scrollIntoView({ block: "start" });
      await new Promise(resolve => setTimeout(resolve, SETTLE_DELAY_MS));

      const fullCanvas = await html2canvas(target, {
        scale: 2,
        useCORS: true,
        backgroundColor: "#ffffff",
        windowWidth: CAPTURE_WIDTH_PX,
      });

      const pxPerMm = fullCanvas.width / A4_WIDTH_MM;
      const pageHeightPx = Math.round(A4_HEIGHT_MM * pxPerMm);
      const totalPages = Math.max(1, Math.ceil(fullCanvas.height / pageHeightPx));

      const pdf = new jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });

      for (let i = 0; i < totalPages; i++) {
        btn.textContent = `Rendering page ${i + 1} of ${totalPages}...`;

        const sliceHeightPx = Math.min(pageHeightPx, fullCanvas.height - i * pageHeightPx);
        const sliceCanvas = document.createElement("canvas");
        sliceCanvas.width = fullCanvas.width;
        sliceCanvas.height = sliceHeightPx;
        sliceCanvas.getContext("2d").drawImage(
          fullCanvas,
          0, i * pageHeightPx, fullCanvas.width, sliceHeightPx,
          0, 0, fullCanvas.width, sliceHeightPx
        );

        const imgData = sliceCanvas.toDataURL("image/png");
        const sliceHeightMm = sliceHeightPx / pxPerMm;

        if (i > 0) pdf.addPage();
        pdf.addImage(imgData, "PNG", 0, 0, A4_WIDTH_MM, sliceHeightMm);
      }

      pdf.save("attendance.pdf");
    } catch (err) {
      alert("PDF export failed: " + (err && err.message ? err.message : err));
    } finally {
      target.style.width = prevWidth;
      target.style.maxWidth = prevMaxWidth;
      document.body.classList.remove("pdf-exporting");
      btn.disabled = false;
      btn.textContent = originalLabel;
      window.scrollTo(originalScrollX, originalScrollY);
    }
  }

  document.getElementById("downloadPdf").addEventListener("click", exportPdf);

  const saveStatusEl = document.getElementById("saveStatus");

  document.getElementById("saveBtn").addEventListener("click", () => {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      saveStatusEl.textContent = "Saved";
    } catch (err) {
      saveStatusEl.textContent = "";
      alert("Couldn't save: " + (err && err.message ? err.message : err));
      return;
    }
    setTimeout(() => {
      if (saveStatusEl.textContent === "Saved") saveStatusEl.textContent = "";
    }, 2500);
  });
</script>
</body>
</html>
