name: Publish Daily Current Affairs
on:
  schedule:
    # 04:00 Asia/Kolkata = 22:30 UTC on the previous day
    - cron: "30 22 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/daily-current-affairs.yml"
  workflow_dispatch:
    inputs:
      start_date:
        description: "First date to generate (YYYY-MM-DD)"
        required: true
        type: string
        default: "2026-01-01"
      end_date:
        description: "Last date to generate (YYYY-MM-DD)"
        required: true
        type: string
        default: "2026-10-15"
permissions:
  contents: read
concurrency:
  group: daily-current-affairs
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate and publish today's free quiz
        env:
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          today="$(TZ=Asia/Kolkata date +%F)"
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            start="${START_DATE:-$today}"
            end="${END_DATE:-$today}"
          else
            start="${START_DATE:-2026-01-01}"
            end="${END_DATE:-2026-10-15}"
          fi
          [[ "$start" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ && "$end" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "Dates must use YYYY-MM-DD"; exit 2; }
          [[ "$start" < "$end" || "$start" == "$end" ]] || { echo "start_date must not be after end_date"; exit 2; }
          [[ "$start" >= "2026-01-01" && "$end" <= "$today" ]] || { echo "Date range must be from 2026-01-01 through today"; exit 2; }
          current="$start"
          while [[ "$current" < "$end" || "$current" == "$end" ]]; do
            echo "Generating bilingual daily quiz for $current"
            TARGET_DATE="$current" node scripts/daily-current-affairs.mjs
            current="$(date -u -d "$current + 1 day" +%F)"
            sleep 2
          done
