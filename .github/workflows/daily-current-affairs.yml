name: Publish Daily Current Affairs
on:
  schedule:
    # 04:00 Asia/Kolkata = 22:30 UTC on the previous day
    - cron: "30 22 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daily-current-affairs
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate and publish today's free quiz
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/daily-current-affairs.mjs
