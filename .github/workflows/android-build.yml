# Manual build of the Android app (.aab) from android/twa-manifest.json. Not part of the site deploy.
# Needs repo secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD (alias "upload").
name: Build Android app
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -e
          [ -n "$KEYSTORE_B64" ] || { echo "Missing ANDROID_KEYSTORE_BASE64 secret"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > upload-keystore.jks
          npm i -g @bubblewrap/cli@1.22.4
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json
          bubblewrap update --manifest=twa-manifest.json --skipVersionUpgrade || true
          bubblewrap build --skipPwaValidation
          ls -la *.aab
      - uses: actions/upload-artifact@v4
        with:
          name: tettesthub-aab
          path: android/app-release-bundle.aab
          retention-days: 7
