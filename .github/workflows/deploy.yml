name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            ludo-3d/package-lock.json
            bulbul-bhatia/package-lock.json
            mukesh-singh-dahiya/package-lock.json

      - name: Install Ludo 3D dependencies
        working-directory: ludo-3d
        run: npm ci

      - name: Build Ludo 3D
        working-directory: ludo-3d
        run: npm run build

      - name: Install Bulbul Bhatia dependencies
        working-directory: bulbul-bhatia
        run: npm ci

      - name: Build Bulbul Bhatia
        working-directory: bulbul-bhatia
        run: npm run build

      - name: Install Mukesh Singh Dahiya dependencies
        working-directory: mukesh-singh-dahiya
        run: npm ci

      - name: Build Mukesh Singh Dahiya
        working-directory: mukesh-singh-dahiya
        run: npm run build

      - name: Assemble combined site
        run: |
          set -e
          rm -rf _site
          mkdir -p _site

          # TET Test Hub: marketing site + test pages at the site root
          cp index.html tests.html login.html dashboard.html about.html contact.html _site/
          cp tet-mock-test-*.html _site/
          cp -r assets _site/assets
          cp -r js _site/js
          cp saanp-seedhi-multiplayer.html _site/
          cp 404.html _site/

          # BBC English Coaching Classes Burhar platform, static, no build step
          cp -r bbc-english _site/bbc-english

          # 80-Second Video Maker, static, no build step
          cp -r video-cutter _site/video-cutter

          # Primary Teacher, static, no build step
          cp -r primary-teacher _site/primary-teacher

          # Ludo 3D build output
          mkdir -p _site/ludo-3d
          cp -r ludo-3d/dist/. _site/ludo-3d/

          # Bulbul Bhatia build output
          mkdir -p _site/bulbul-bhatia
          cp -r bulbul-bhatia/dist/. _site/bulbul-bhatia/

          # Mukesh Singh Dahiya build output
          mkdir -p _site/mukesh-singh-dahiya
          cp -r mukesh-singh-dahiya/dist/. _site/mukesh-singh-dahiya/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
