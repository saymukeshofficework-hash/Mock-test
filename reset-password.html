<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Reset Password — TET Test Hub</title><link rel="stylesheet" href="assets/site.css?v=2"><style>
.wrap{min-height:68vh;display:grid;place-items:center;padding:40px 16px}.card{width:min(440px,100%);background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:28px;box-shadow:0 18px 50px rgba(0,0,0,.08)}.field{margin:16px 0}.field label{display:block;font-weight:650;margin-bottom:7px}.password{position:relative}.password input{padding-right:50px}.password button{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;cursor:pointer}.alert{padding:11px 13px;border-radius:10px;margin-bottom:16px}.ok{background:#ecfdf5;color:#065f46}.err{background:#fef2f2;color:#991b1b}
</style></head><body>
<header class="site-header"><a class="brand" href="index.html">TET Test Hub</a><nav><a href="index.html">Home</a><a href="tests.html">All Tests</a><a href="login.html" class="active">Login</a></nav></header>
<main class="wrap"><section class="card"><h1>Set a new password</h1><p>Choose a new password for your TET Test Hub account.</p><div id="alert" class="alert" style="display:none"></div>
<form id="form" style="display:none"><div class="field"><label>New Password</label><div class="password"><input id="p1" type="password" minlength="6" required><button type="button" onclick="toggle('p1',this)">Show</button></div></div><div class="field"><label>Confirm Password</label><div class="password"><input id="p2" type="password" minlength="6" required><button type="button" onclick="toggle('p2',this)">Show</button></div></div><button class="btn btn-primary btn-block" id="btn">UPDATE PASSWORD</button></form></section></main>
<script src="assets/vendor/supabase/supabase.js"></script><script src="js/site-config.js?v=3"></script><script src="js/auth.js?v=3"></script>
<script>
function toggle(id,b){const x=document.getElementById(id);x.type=x.type==='password'?'text':'password';b.textContent=x.type==='password'?'Show':'Hide'}
const a=document.getElementById('alert');function msg(t,ok){a.textContent=t;a.className='alert '+(ok?'ok':'err');a.style.display='block'}
async function prepareRecovery(){
  if(!supabaseClient){msg('Password reset is unavailable right now.',false);return false}
  try{
    const params=new URLSearchParams(location.search);
    const code=params.get('code');
    if(code){
      const {error}=await supabaseClient.auth.exchangeCodeForSession(code);
      if(error) console.warn('Recovery code exchange failed:',error.message||error);
      history.replaceState({},document.title,location.pathname);
    }
    const {data}=await supabaseClient.auth.getSession();
    if(data.session){
      document.getElementById('form').style.display='block';
      a.style.display='none';
      return true;
    }
    const hash=location.hash||'';
    if(hash.includes('access_token=')){
      await new Promise(r=>setTimeout(r,500));
      const retry=await supabaseClient.auth.getSession();
      if(retry.data.session){
        document.getElementById('form').style.display='block';
        a.style.display='none';
        return true;
      }
    }
    msg('This password-reset link is invalid or expired. Please request a new reset link.',false);
    return false;
  }catch(e){
    console.warn('Recovery initialization failed:',e);
    msg('Unable to open the password-reset session. Please request a new reset link.',false);
    return false;
  }
}
prepareRecovery();
document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();a.style.display='none';const p1=document.getElementById('p1').value,p2=document.getElementById('p2').value,b=document.getElementById('btn');if(p1!==p2){msg('Passwords do not match.',false);return}b.disabled=true;b.textContent='UPDATING...';const r=await updatePassword(p1);if(!r.ok){msg(r.message,false);b.disabled=false;b.textContent='UPDATE PASSWORD';return}msg(r.message,true);setTimeout(()=>location.href='login.html',1200)});
</script></body></html>
