<script>
// Served as /examhelp/ (Android app start page) and /examhelp/login.html.
// Only the login copy goes to login; /examhelp/ opens the public homepage.
(function(){
  var isLogin=/\/login\.html$/.test(location.pathname);
  if(!isLogin&&/[?&]source=android/.test(location.search)){try{localStorage.setItem('tth-app','1')}catch(e){}}
  window.location.replace(isLogin?'/login.html':'/index.html'+location.search);
})();
</script>
