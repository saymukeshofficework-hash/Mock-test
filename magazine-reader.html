<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>पत्रिकाएँ — ऑनलाइन पढ़ें | Magazines | TET Test Hub</title><meta name="robots" content="noindex">
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#263d69 0%,#100d19 58%);color:#f7f3ff;font-family:system-ui,"Noto Sans Devanagari",sans-serif;-webkit-user-select:none;user-select:none}header{padding:14px 18px;border-bottom:1px solid #35415c}.bar{max-width:900px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px}.bar a,.btn{color:#fff;text-decoration:none;background:#26344f;padding:9px 13px;border-radius:10px;border:0;font:inherit;cursor:pointer}.btn.pri{background:#dbeafe;color:#12346b;font-weight:800}.btn:disabled{opacity:.4;cursor:default}main{max-width:900px;margin:auto;padding:20px 12px}h1{font-size:20px;margin:6px 0 4px}.muted{color:#b7c4d8;font-size:14px}.ctl{display:flex;justify-content:center;align-items:center;gap:10px;margin:12px 0}.ctl input{width:64px;padding:7px;border-radius:8px;border:1px solid #3a4b68;background:#111c2d;color:#fff;text-align:center;font:inherit}.page{position:relative;max-width:820px;margin:auto;aspect-ratio:210/297;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 8px 30px #0008}.page img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;-webkit-user-drag:none}.cover{position:absolute;inset:0}.wm{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-around;align-items:center;pointer-events:none;opacity:.08;color:#000;font-weight:800;font-size:clamp(14px,3.4vw,28px);white-space:nowrap}.wm span{transform:rotate(-30deg)}.msg{display:flex;height:100%;align-items:center;justify-content:center;color:#334;text-align:center;padding:20px}@media print{body{display:none}}</style></head>
<style>html[data-app] [data-sale]{display:none!important}.buy{max-width:820px;margin:10px auto 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;background:#1b2a44;border:1px solid #3a4b68;border-radius:12px;padding:10px 12px}.buy .btn.gold{background:#facc15;color:#1a1400;font-weight:800}</style>
<script>try{if(sessionStorage.getItem("tth-app")==="1")document.documentElement.setAttribute("data-app","1")}catch(e){}</script>
<body oncontextmenu="return false"><header><div class="bar"><b>TET TEST HUB</b><a href="/current-affairs-ebook.html">← E-book</a></div></header>
<main><h1 id="title">पत्रिका / Magazine</h1><p class="muted">केवल ऑनलाइन पढ़ने के लिए · डाउनलोड उपलब्ध नहीं · Read online only</p>
<div class="buy" id="buy" data-sale hidden><span id="buymsg">इस पुस्तक की PDF अपने फ़ोन में रखें / Keep the PDF on your phone</span><button class="btn gold" id="buybtn">📥 PDF डाउनलोड ₹25 / Download PDF ₹25</button></div>
<div class="ctl"><button class="btn" id="prev">‹ पिछला</button><span><input id="num" type="number" min="1" value="1"> / <span id="total">–</span></span><button class="btn pri" id="next">अगला ›</button></div>
<div class="page" id="pg"><div class="msg" id="msg">लोड हो रहा है… / Loading…</div><img id="img" alt="" draggable="false" hidden><div class="cover"></div><div class="wm" id="wm"></div></div>
<div class="ctl"><button class="btn" id="prev2">‹ पिछला</button><button class="btn pri" id="next2">अगला ›</button></div></main>
<script src="assets/vendor/supabase/supabase.js"></script><script src="js/site-config.js?v=3"></script><script src="js/auth.js?v=2"></script>
<script>
(async()=>{
const FN="https://znulepzdihzhjmuvyroi.supabase.co/functions/v1/notes-checkout";
const ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpudWxlcHpkaWh6aGptdXZ5cm9pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExMjE5MjIsImV4cCI6MjEwNjY5NzkyMn0.XoqC6vNDJkEAxgtXLVPCpTxocv3lAa-ZBeg69OdbhdU";
const call=b=>fetch(FN,{method:"POST",headers:{"Content-Type":"application/json",apikey:ANON,Authorization:"Bearer "+ANON},body:JSON.stringify(b)}).then(r=>r.json()).catch(()=>({error:"net"}));
const $=id=>document.getElementById(id);
const q=new URLSearchParams(location.search);
let id=q.get("book");try{if(id)localStorage.setItem("tth_book_last",id);else id=localStorage.getItem("tth_book_last")}catch(e){}
const session=await getSession();
if(!session){location.replace("login.html?next=magazine-reader.html");return}
const who=(session.user&&(session.user.email||session.user.phone))||"";
$("wm").innerHTML=who?[0,1,2].map(()=>"<span>tettesthub.in · "+who.replace(/[<>&]/g,"")+"</span>").join(""):"";
const list=(await call({action:"book_list"})).books||[];
const book=list.find(b=>b.id===id)||list[0];
if(!book){$("msg").textContent="पत्रिका नहीं मिली / Magazine not found";return}
$("title").textContent=book.hi;document.title=book.hi+" | TET Test Hub";$("total").textContent=book.pages;$("num").max=book.pages;
if(book.pdf){$("buy").hidden=false;const m=document.querySelector(".muted");if(m)m.textContent="ऑनलाइन पढ़ें · PDF अलग से डाउनलोड करें / Read online · PDF download available";pdfBuy(book.pdf)}
let page=1;try{page=Math.min(book.pages,Math.max(1,parseInt(q.get("p")||localStorage.getItem("tth_book_page_"+book.id)||"1",10)||1))}catch(e){}
const cache={};
async function show(n){
 page=Math.min(book.pages,Math.max(1,n));const want=page;$("num").value=page;
 $("prev").disabled=$("prev2").disabled=page<=1;$("next").disabled=$("next2").disabled=page>=book.pages;
 try{localStorage.setItem("tth_book_page_"+book.id,page);history.replaceState(null,"","?book="+book.id+"&p="+page)}catch(e){}
 const c=cache[page];
 if(!c||Date.now()-c.t>150000){
  $("img").hidden=true;$("msg").hidden=false;$("msg").textContent="पेज लोड हो रहा है… / Loading page…";
  const s=await getSession();const d=await call({action:"book_pages",book:book.id,from:page,count:2,access_token:s&&s.access_token});
  if(d.error==="login_required"){location.replace("login.html?next=magazine-reader.html");return}
  if(!d.urls){$("msg").textContent="पेज लोड नहीं हुआ, दोबारा कोशिश करें / Page did not load";return}
  d.urls.forEach((u,i)=>{cache[d.from+i]={u,t:Date.now()};new Image().src=u});
 }
 if(cache[want]&&page===want){$("img").src=cache[want].u;$("img").hidden=false;$("msg").hidden=true;scrollTo(0,0)}
}
async function pdfBuy(prod){
 const btn=$("buybtn"),say=t=>$("buymsg").textContent=t,KEY="tth_orders_"+prod;
 const ids=()=>{try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){return[]}};
 let token=null;
 const dl=async()=>{btn.disabled=true;say("PDF तैयार हो रही है… / Preparing PDF…");const d=await call({action:"download",token});btn.disabled=false;
  if(d.url){say("✅ डाउनलोड शुरू / Download started ("+d.downloads+"/"+d.max+")");location.href=d.url}
  else say(d.error==="limit"?"डाउनलोड सीमा पूरी हो गई, सहायता से संपर्क करें / Download limit reached, contact support":"डाउनलोड नहीं हुआ, फिर कोशिश करें / Download failed, try again")};
 const owned=t=>{token=t;btn.textContent="📥 PDF डाउनलोड करें / Download PDF";say("✅ आपने PDF खरीद ली है / You own this PDF")};
 const s0=await getSession();const c=await call({action:"claim",product:prod,order_ids:ids(),access_token:s0&&s0.access_token});if(c.token)owned(c.token);
 const loadRzp=()=>window.Razorpay?Promise.resolve():new Promise((ok,bad)=>{const sc=document.createElement("script");sc.src="https://checkout.razorpay.com/v1/checkout.js";sc.onload=ok;sc.onerror=bad;document.head.appendChild(sc)});
 btn.onclick=async()=>{
  if(token)return dl();
  const s=await getSession();if(!s){location.replace("login.html?next=magazine-reader.html");return}
  btn.disabled=true;say("पेमेंट खुल रहा है… / Opening payment…");
  try{
   const o=await call({action:"create",product:prod,access_token:s.access_token});
   if(!o.order_id)throw new Error(o.error||"order");
   if(String(o.key_id).startsWith("rzp_test_"))throw new Error("test_key");
   try{localStorage.setItem(KEY,JSON.stringify([o.order_id,...ids()].slice(0,10)))}catch(e){}
   await loadRzp();
   new Razorpay({key:o.key_id,order_id:o.order_id,amount:o.amount,currency:o.currency,name:o.name,description:o.description,prefill:{email:s.user.email||""},
    handler:async r=>{say("पेमेंट जाँच रहे हैं… / Checking payment…");const v=await call({action:"verify",order_id:r.razorpay_order_id,payment_id:r.razorpay_payment_id,signature:r.razorpay_signature});btn.disabled=false;
     if(v.token){owned(v.token);dl()}else say("पेमेंट मिला, पेज रीलोड करें / Payment received, reload the page")},
    modal:{ondismiss:()=>{btn.disabled=false;say("इस पुस्तक की PDF अपने फ़ोन में रखें / Keep the PDF on your phone")}}}).open();
  }catch(e){btn.disabled=false;say("पेमेंट शुरू नहीं हुआ, फिर कोशिश करें / Could not start payment, try again")}
 };
}
const go=k=>show(page+k);
$("prev").onclick=$("prev2").onclick=()=>go(-1);$("next").onclick=$("next2").onclick=()=>go(1);
$("num").onchange=e=>show(parseInt(e.target.value,10)||1);
addEventListener("keydown",e=>{if(e.key==="ArrowRight")go(1);if(e.key==="ArrowLeft")go(-1);if((e.ctrlKey||e.metaKey)&&/^[sp]$/i.test(e.key))e.preventDefault()});
let x=null;$("pg").addEventListener("touchstart",e=>x=e.touches[0].clientX,{passive:true});$("pg").addEventListener("touchend",e=>{if(x===null)return;const dx=e.changedTouches[0].clientX-x;if(Math.abs(dx)>50)go(dx<0?1:-1);x=null});
show(page);
})();
</script></body></html>
