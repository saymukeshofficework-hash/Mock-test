<!DOCTYPE html>
<html lang="hi">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width,initial-scale=1.0,maximum-scale=1.0"
		/>
		<title>गीता ओलम्पियाड टेस्ट 4</title>
		<style>
			:root {
				--navy: #16204e;
				--navy-l: #22307a;
				--blue: #2f6fed;
				--blue-l: #eaf1ff;
				--green: #1ba672;
				--red: #e2483d;
				--purple: #8b5cf6;
				--bg: #f4f6fb;
				--ink: #1c2233;
				--muted: #6b7280;
				--border: #e1e5ee;
			}
			* {
				box-sizing: border-box;
			}
			html,
			body {
				margin: 0;
				padding: 0;
			}
			body {
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
					Roboto, "Noto Sans Devanagari", Helvetica, Arial, sans-serif;
				background: var(--bg);
				color: var(--ink);
			}
			#app {
				max-width: 720px;
				margin: 0 auto;
				min-height: 100vh;
				background: #fff;
				display: flex;
				flex-direction: column;
			}
			.topbar {
				background: var(--navy);
				color: #fff;
				padding: 14px 16px;
				display: flex;
				justify-content: space-between;
				align-items: flex-start;
				gap: 10px;
			}
			.topbar .ttext {
				font-weight: 800;
				font-size: 17px;
			}
			.topbar small {
				display: block;
				font-weight: 400;
				opacity: 0.75;
				font-size: 12px;
				margin-top: 3px;
			}
			.langBtn {
				flex: 0 0 auto;
				background: rgba(255, 255, 255, 0.14);
				border: 1px solid rgba(255, 255, 255, 0.45);
				color: #fff;
				padding: 7px 13px;
				border-radius: 999px;
				font-size: 12.5px;
				font-weight: 700;
				white-space: nowrap;
				cursor: pointer;
			}
			.langBtn:active {
				background: rgba(255, 255, 255, 0.28);
			}
			.timerbar {
				background: var(--blue);
				color: #fff;
				display: flex;
				align-items: center;
				justify-content: space-between;
				padding: 10px 16px;
				font-size: 14px;
			}
			#timer {
				background: #0d1430;
				padding: 5px 12px;
				border-radius: 6px;
				font-weight: 700;
				font-variant-numeric: tabular-nums;
				font-size: 15px;
			}
			.timerbar.warn #timer {
				background: var(--red);
			}
			.sectiontabs {
				display: flex;
				overflow-x: auto;
				gap: 6px;
				padding: 10px 12px;
				background: var(--blue-l);
				border-bottom: 1px solid var(--border);
			}
			.sectiontabs button {
				flex: 0 0 auto;
				border: 1px solid #c7d6f7;
				background: #fff;
				color: var(--navy);
				padding: 7px 10px;
				border-radius: 999px;
				font-size: 12.5px;
				font-weight: 600;
				white-space: nowrap;
			}
			.sectiontabs button.active {
				background: var(--navy);
				border-color: var(--navy);
				color: #fff;
			}
			.palette {
				display: grid;
				grid-template-columns: repeat(8, 1fr);
				gap: 6px;
				padding: 12px;
				max-height: 190px;
				overflow-y: auto;
				background: #fbfcfe;
				border-bottom: 1px solid var(--border);
			}
			.pcell {
				aspect-ratio: 1;
				border-radius: 7px;
				border: 1px solid var(--border);
				background: #fff;
				color: var(--ink);
				font-size: 12px;
				font-weight: 700;
				display: flex;
				align-items: center;
				justify-content: center;
				position: relative;
				cursor: pointer;
			}
			.pcell.current {
				outline: 2px solid var(--navy);
				outline-offset: 1px;
			}
			.pcell.answered {
				background: var(--green);
				border-color: var(--green);
				color: #fff;
			}
			.pcell.notanswered {
				background: var(--red);
				border-color: var(--red);
				color: #fff;
			}
			.pcell.marked {
				background: var(--purple);
				border-color: var(--purple);
				color: #fff;
			}
			.pcell.marked.answered::after {
				content: "";
				position: absolute;
				bottom: 2px;
				right: 2px;
				width: 6px;
				height: 6px;
				border-radius: 50%;
				background: var(--green);
				border: 1px solid #fff;
			}
			.legend {
				display: flex;
				flex-wrap: wrap;
				gap: 10px;
				padding: 8px 14px;
				font-size: 11px;
				color: var(--muted);
				background: #fbfcfe;
				border-bottom: 1px solid var(--border);
			}
			.legend span {
				display: inline-flex;
				align-items: center;
				gap: 4px;
			}
			.dot {
				width: 9px;
				height: 9px;
				border-radius: 3px;
				display: inline-block;
			}
			.qpanel {
				padding: 16px;
				flex: 1;
			}
			.qmeta {
				display: flex;
				justify-content: space-between;
				align-items: center;
				margin-bottom: 10px;
				gap: 8px;
			}
			.qno {
				font-weight: 700;
				font-size: 14px;
				color: var(--navy);
				flex: 0 0 auto;
			}
			.qsec {
				font-size: 11px;
				color: #fff;
				background: var(--navy-l);
				padding: 3px 9px;
				border-radius: 999px;
				font-weight: 600;
				text-align: right;
			}
			.qtext {
				font-size: 16px;
				line-height: 1.65;
				margin-bottom: 16px;
				font-weight: 600;
			}
			.options {
				display: flex;
				flex-direction: column;
				gap: 10px;
			}
			.opt {
				display: flex;
				align-items: flex-start;
				gap: 10px;
				border: 1px solid var(--border);
				border-radius: 10px;
				padding: 11px 12px;
				font-size: 15px;
				line-height: 1.55;
				cursor: pointer;
			}
			.opt.selected {
				border-color: var(--blue);
				background: var(--blue-l);
			}
			.opt input {
				margin-top: 4px;
				flex: 0 0 auto;
			}
			.opt label {
				flex: 1;
				cursor: pointer;
			}
			.actions {
				display: flex;
				gap: 10px;
				padding: 0 16px 10px;
			}
			.actions button {
				flex: 1;
				padding: 12px 8px;
				border-radius: 8px;
				border: 1px solid var(--border);
				background: #fff;
				font-weight: 600;
				font-size: 13px;
				color: var(--navy);
			}
			.actions2 {
				display: flex;
				gap: 10px;
				padding: 0 16px 16px;
			}
			.actions2 button {
				flex: 1;
				padding: 13px 8px;
				border-radius: 8px;
				border: none;
				font-weight: 700;
				font-size: 14px;
			}
			#prevBtn {
				background: #eef0f6;
				color: var(--navy);
			}
			#saveBtn {
				background: var(--green);
				color: #fff;
			}
			.submitwrap {
				padding: 0 16px 22px;
			}
			#submitBtn {
				width: 100%;
				padding: 14px;
				border: none;
				border-radius: 8px;
				background: var(--blue);
				color: #fff;
				font-weight: 700;
				font-size: 15px;
			}
			/* Name entry screen */
			#nameScreen {
				max-width: 720px;
				margin: 0 auto;
				min-height: 100vh;
				background: #fff;
				display: flex;
				flex-direction: column;
			}
			#nameScreen .ntop {
				background: var(--navy);
				color: #fff;
				padding: 14px 16px;
				display: flex;
				justify-content: space-between;
				align-items: flex-start;
				gap: 10px;
			}
			#nameScreen .ncard {
				flex: 1;
				display: flex;
				flex-direction: column;
				justify-content: center;
				align-items: center;
				padding: 28px 24px;
				text-align: center;
			}
			#nameScreen .nicon {
				width: 60px;
				height: 60px;
				border-radius: 50%;
				background: var(--blue-l);
				color: var(--navy);
				display: flex;
				align-items: center;
				justify-content: center;
				font-size: 26px;
				font-weight: 800;
				margin-bottom: 18px;
			}
			#nameScreen .ntitle {
				font-size: 19px;
				font-weight: 800;
				color: var(--navy);
				margin-bottom: 6px;
			}
			#nameScreen .nsub {
				font-size: 13.5px;
				color: var(--muted);
				margin-bottom: 24px;
			}
			#nameScreen .nfield {
				width: 100%;
				max-width: 340px;
				text-align: left;
				margin-bottom: 22px;
			}
			#nameScreen .nfield label {
				display: block;
				font-size: 12.5px;
				font-weight: 600;
				color: var(--navy);
				margin-bottom: 6px;
			}
			#nameInput {
				width: 100%;
				padding: 13px 14px;
				border: 1.5px solid var(--border);
				border-radius: 10px;
				font-size: 16px;
				color: var(--ink);
				background: #fbfcfe;
			}
			#nameInput:focus {
				outline: none;
				border-color: var(--blue);
			}
			#startBtn {
				width: 100%;
				max-width: 340px;
				padding: 14px;
				border: none;
				border-radius: 8px;
				background: var(--blue);
				color: #fff;
				font-weight: 700;
				font-size: 15px;
			}
			/* Result screen */
			#resultScreen {
				display: none;
				max-width: 720px;
				margin: 0 auto;
				background: #fff;
				min-height: 100vh;
			}
			.rhero {
				background: var(--navy);
				color: #fff;
				padding: 28px 20px 22px;
				text-align: center;
				position: relative;
			}
			.rhero .rbrand {
				font-size: 11px;
				font-weight: 600;
				letter-spacing: 1px;
				opacity: 0.6;
				text-transform: uppercase;
			}
			.rhero .rname {
				font-size: 14px;
				font-weight: 700;
				margin-top: 8px;
				opacity: 0.95;
			}
			.rhero .score {
				font-size: 46px;
				font-weight: 800;
				line-height: 1;
				margin-top: 6px;
			}
			.rhero .outof {
				font-size: 14px;
				opacity: 0.8;
				margin-top: 4px;
			}
			.rhero .pct {
				display: inline-block;
				margin-top: 10px;
				background: rgba(255, 255, 255, 0.12);
				padding: 5px 14px;
				border-radius: 999px;
				font-size: 13px;
				font-weight: 600;
			}
			.rhero .langBtn {
				position: absolute;
				top: 14px;
				right: 14px;
			}
			.rwrap {
				padding: 0 18px 24px;
			}
			table.rtable {
				width: 100%;
				border-collapse: collapse;
				margin: 18px 0;
				font-size: 12.5px;
			}
			table.rtable th,
			table.rtable td {
				padding: 8px 6px;
				text-align: center;
				border-bottom: 1px solid var(--border);
			}
			table.rtable th {
				background: #f4f6fb;
				font-size: 11px;
				color: var(--muted);
				text-transform: uppercase;
				letter-spacing: 0.3px;
			}
			table.rtable td:first-child,
			table.rtable th:first-child {
				text-align: left;
			}
			.rnote {
				font-size: 12.5px;
				color: var(--muted);
				margin: 4px 0 16px;
			}
			details.qreview {
				border: 1px solid var(--border);
				border-radius: 8px;
				margin-bottom: 8px;
				padding: 10px 12px;
			}
			details.qreview summary {
				font-size: 13px;
				font-weight: 600;
				cursor: pointer;
				display: flex;
				justify-content: space-between;
				align-items: center;
				list-style: none;
				gap: 8px;
			}
			details.qreview summary::-webkit-details-marker {
				display: none;
			}
			.rtag {
				font-size: 11px;
				font-weight: 700;
				padding: 2px 8px;
				border-radius: 999px;
				color: #fff;
				flex-shrink: 0;
			}
			.rtag.ok {
				background: var(--green);
			}
			.rtag.bad {
				background: var(--red);
			}
			.rtag.skip {
				background: var(--muted);
			}
			.rqtext {
				font-size: 14px;
				margin: 10px 0 8px;
				font-weight: 600;
			}
			.rsol {
				font-size: 13px;
				background: #f4f6fb;
				border-radius: 6px;
				padding: 8px 10px;
				margin-bottom: 8px;
				color: var(--muted);
			}
			.ropt {
				font-size: 13.5px;
				padding: 6px 9px;
				border-radius: 6px;
				margin-bottom: 5px;
				border: 1px solid var(--border);
			}
			.ropt.correctAns {
				background: #e6f7f0;
				border-color: var(--green);
			}
			.ropt.wrongChosen {
				background: #fdecea;
				border-color: var(--red);
			}
			#retakeBtn {
				width: 100%;
				padding: 13px;
				border: none;
				border-radius: 8px;
				background: var(--blue);
				color: #fff;
				font-weight: 700;
				font-size: 14px;
				margin-top: 6px;
			}
		.langBtn{display:none !important;}
		</style>
	</head>
	<body>
		<div id="nameScreen">
			<div class="ntop">
				<div>
					<div class="ttext">गीता ओलम्पियाड मॉक टेस्ट</div>
					<small id="nSubtitleText"
						>टेस्ट 4 (प्रश्न 76–100) &nbsp;&middot;&nbsp; 25 प्रश्न</small
					>
				</div>
				<button class="langBtn" id="langBtnName" type="button">
					हिंदी
				</button>
			</div>
			<div class="ncard">
				<div class="nicon">&#2384;</div>
				<div class="ntitle" id="nCardTitle">शुरू करने से पहले</div>
				<div class="nsub" id="nCardSub">
					अपना नाम दर्ज करें ताकि यह आपके परिणाम में दिखे।
				</div>
				<div class="nfield">
					<label for="nameInput" id="nFieldLabel">विद्यार्थी का नाम</label>
					<input
						type="text"
						id="nameInput"
						placeholder="e.g. Riya Sharma"
						maxlength="60"
						autocomplete="off"
					/>
				</div>
				<button id="startBtn" type="button">टेस्ट शुरू करें</button>
			</div>
		</div>

		<div id="app" style="display: none">
			<div class="topbar">
				<div>
					<div class="ttext">गीता ओलम्पियाड मॉक टेस्ट</div>
					<small id="subtitleText"
						>टेस्ट 4 (प्रश्न 76–100) &nbsp;&middot;&nbsp; 25 प्रश्न</small
					>
				</div>
				<button class="langBtn" id="langBtn" type="button">
					हिंदी
				</button>
			</div>
			<div class="timerbar" id="timerbar">
				<span id="timeLeftLabel">शेष समय</span>
				<span id="timer">30:00</span>
			</div>
			<div class="sectiontabs" id="sectiontabs"></div>
			<div class="palette" id="palette"></div>
			<div class="legend">
				<span
					><i class="dot" style="background: var(--green)"></i
					><span id="legAns">Answered</span></span
				>
				<span
					><i class="dot" style="background: var(--red)"></i
					><span id="legNot">Not Answered</span></span
				>
				<span
					><i class="dot" style="background: var(--purple)"></i
					><span id="legMarked">Marked</span></span
				>
				<span
					><i
						class="dot"
						style="
							background: #fff;
							border: 1px solid var(--border);
						"
					></i
					><span id="legVisit">Not Visited</span></span
				>
			</div>
			<div class="qpanel" id="qpanel">
				<div class="qmeta">
					<span class="qno" id="qno">Q 1 of 100</span>
					<span class="qsec" id="qsec"></span>
				</div>
				<div class="qtext" id="qtext"></div>
				<div class="options" id="options"></div>
			</div>
			<div class="actions">
				<button id="clearBtn">Clear Response</button>
				<button id="markBtn">Mark for Review & Next</button>
			</div>
			<div class="actions2">
				<button id="prevBtn">&#8249; Previous</button>
				<button id="saveBtn">Save & Next &#8250;</button>
			</div>
			<div class="submitwrap">
				<button id="submitBtn">Submit Test</button>
			</div>
		</div>

		<div id="resultScreen"></div>

			function buildTabs() {
				elTabs.innerHTML = "";
				SECTIONS.forEach((sec) => {
					const b = document.createElement("button");
					b.textContent = sec.label[lang];
					b.dataset.key = sec.key;
					b.onclick = () => {
						cur = secRange[sec.key].start;
						render();
					};
					elTabs.appendChild(b);
				});
			}

			function buildPalette() {
				elPalette.innerHTML = "";
				for (let i = 0; i < TOTAL; i++) {
					const c = document.createElement("div");
					c.className = "pcell";
					c.textContent = i + 1;
					c.onclick = () => {
						cur = i;
						render();
					};
					elPalette.appendChild(c);
				}
			}

			function renderPalette() {
				const cells = elPalette.children;
				for (let i = 0; i < TOTAL; i++) {
					const c = cells[i];
					c.className = "pcell";
					if (i === cur) c.classList.add("current");
					const hasA = answers.hasOwnProperty(i);
					const isMark = marked.has(i);
					if (isMark) {
						c.classList.add("marked");
						if (hasA) c.classList.add("answered");
					} else if (hasA) c.classList.add("answered");
					else if (visited.has(i)) c.classList.add("notanswered");
				}
			}

			function renderTabs() {
				[...elTabs.children].forEach((b) =>
					b.classList.toggle("active", Q[cur].s === b.dataset.key)
				);
			}

			function renderQuestion() {
				const item = Q[cur];
				const sec = SECTIONS.find((s) => s.key === item.s);
				document.getElementById("qno").textContent = t().qof(
					cur + 1,
					TOTAL
				);
				document.getElementById("qsec").textContent = sec.label[lang];
				document.getElementById("qtext").textContent = item.q[lang];

				optDiv.innerHTML = "";
				item.o[lang].forEach((optText, idx) => {
					const wrap = document.createElement("div");
					wrap.className =

					wrap.innerHTML =

					let opts = "";
					item.o[lang].forEach((ot, idx) => {
						let cls = "";
						if (idx === item.a) cls = "correctAns";
						else if (idx === g) cls = "wrongChosen";
						opts += `<div class="ropt ${cls}">${String.fromCharCode(
							65 + idx
						)}. ${ot}</div>`;
					});
					review += `<details class="qreview"><summary><span>${
						u.qLabelPrefix
					}${i + 1}. ${
						SECTIONS.find((s) => s.key === item.s).label[lang]
					}</span><span class="rtag ${tag}">${tl}</span></summary>
   <div class="rqtext">${item.q[lang]}</div>
   ${opts}
   <div class="rsol"><b>${u.solution}</b> ${item.sol[lang]}</div>
  </details>`;
				});

				rs.innerHTML = `
  <div class="rhero">
   <button class="langBtn" id="langBtnResult" type="button">${
		u.langBtn
   }</button>
   <div class="rbrand">${u.rbrand}</div>
   <div class="rname">${studentName ? studentName : u.defaultName}</div>
   <div class="score">${tot} / ${TOTAL}</div>
   <div class="outof">${u.outof(auto)}</div>
   <div class="pct">${pct}% ${u.scoreLabel}</div>
  </div>
  <div class="rwrap">
   <table class="rtable">
    <tr><th>${u.thSection}</th><th>${u.thCorrect}</th><th>${
					u.thWrong
				}</th><th>${u.thSkipped}</th></tr>
    ${rows}
   </table>
   <p class="rnote">${u.rnote}</p>
   ${review}
   <button id="retakeBtn">${u.retake}</button>
  </div>`;

				document.getElementById("langBtnResult").onclick = toggleLang;

				document.getElementById("retakeBtn").onclick = () => {
					answers = {};
					visited = new Set();
					marked = new Set();
					cur = 0;
					timeLeft = DURATION;
					lastResult = null;
					elTimerbar.classList.remove("warn");
					elTimer.textContent = fmt(DURATION);
					rs.style.display = "none";
					document.getElementById("app").style.display = "flex";
					renderPalette();
					render();
					startTimer();
				};
			}

			function applyStaticText() {
				const u = t();
				document.getElementById("subtitleText").textContent =
					u.subtitle;
				document.getElementById("nSubtitleText").textContent =
					u.subtitle;
				document.getElementById("timeLeftLabel").textContent =
					u.timeLeft;
				document.getElementById("legAns").textContent = u.legAns;
				document.getElementById("legNot").textContent = u.legNot;
				document.getElementById("legMarked").textContent = u.legMarked;
				document.getElementById("legVisit").textContent = u.legVisit;
				document.getElementById("clearBtn").textContent = u.clear;
				document.getElementById("markBtn").innerHTML = u.mark.replace(
					"&",
					"&amp;"
				);
				document.getElementById("prevBtn").innerHTML = u.prev;
				document.getElementById("saveBtn").innerHTML = u.save.replace(
					"&",
					"&amp;"
				);
				document.getElementById("submitBtn").textContent = u.submit;
				document.getElementById("langBtn").textContent = u.langBtn;
				document.getElementById("langBtnName").textContent = u.langBtn;
				document.getElementById("nCardTitle").textContent =
					u.nCardTitle;
				document.getElementById("nCardSub").textContent = u.nCardSub;
				document.getElementById("nFieldLabel").textContent =
					u.nFieldLabel;
				document.getElementById("nameInput").placeholder =
					u.nPlaceholder;
				document.getElementById("startBtn").textContent = u.startBtn;
			}

			function toggleLang() {
				lang = lang === "en" ? "hi" : "en";
				applyStaticText();
				buildTabs();
				if (lastResult) {
					renderResultScreen();
				} else {
					render();
				}
			}

			document.getElementById("langBtn").onclick = toggleLang;
			document.getElementById("langBtnName").onclick = toggleLang;

			function beginTest() {
				const val = document.getElementById("nameInput").value.trim();
				studentName = val;
				document.getElementById("nameScreen").style.display = "none";
				document.getElementById("app").style.display = "flex";
				render();
				startTimer();
			}
			document.getElementById("startBtn").onclick = beginTest;
			document
				.getElementById("nameInput")
				.addEventListener("keydown", (e) => {
					if (e.key === "Enter") beginTest();
				});

			applyStaticText();
			buildTabs();
			buildPalette();
			elTimer.textContent = fmt(DURATION);
			document.getElementById("nameInput").focus();
		</script>
	</body>
</html>
