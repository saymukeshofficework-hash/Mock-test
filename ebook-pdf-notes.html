<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#263d69 0%,#100d19 58%);color:#f7f3ff;font-family:system-ui,"Noto Sans Devanagari",sans-serif}
header{padding:14px 18px;border-bottom:1px solid #35415c;background:#171629}
.bar{max-width:900px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-weight:900;letter-spacing:.7px;font-size:clamp(17px,4vw,22px)}
.logo{display:grid;place-items:center;width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#8b5cf6,#ec4899);font-size:21px;box-shadow:0 5px 16px #0005}
.bar a.home{color:#fff;text-decoration:none;background:#26344f;padding:9px 13px;border-radius:10px;white-space:nowrap}
main{max-width:900px;margin:auto;padding:34px 16px}
h1{margin:0 0 8px;font-size:clamp(24px,5vw,32px)}
.sub{color:#c5badc;margin:0}
.book-list{display:grid;gap:16px;margin-top:25px}
.book{display:flex;align-items:center;gap:16px;padding:20px;border:1px solid #554477;border-radius:18px;background:linear-gradient(135deg,#241d3b,#18283d);box-shadow:0 12px 30px #0003}
.cover{flex:0 0 62px;height:78px;display:grid;place-items:center;border-radius:9px;background:linear-gradient(145deg,#f59e0b,#be185d);font-size:31px}
.details{min-width:0;flex:1}
.details h2{font-size:18px;margin:0 0 6px;color:#fff}
.details p{margin:0;color:#c4c9d8;font-size:13px;line-height:1.6}
.book-link{display:inline-flex;margin-top:12px;padding:9px 14px;border-radius:10px;background:linear-gradient(135deg,#7c3aed,#db2777);color:#fff;text-decoration:none;font-size:13px;font-weight:800}
@media(max-width:520px){.book{align-items:flex-start;padding:15px;gap:12px}.cover{flex-basis:48px;height:64px;font-size:25px}.details h2{font-size:16px}.bar a.home{padding:8px 10px;font-size:12px}}
</style>
</head>
