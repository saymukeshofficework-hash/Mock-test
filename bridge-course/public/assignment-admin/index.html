<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Assignment orders · असाइनमेंट ऑर्डर</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1d2433;--soft:#5b6478;--line:#dde2ec;--accent:#1f4fa3;--accent-ink:#fff;--warn:#a23b2a}
@media (prefers-color-scheme:dark){:root{--bg:#12161f;--card:#1a2030;--ink:#e8ecf5;--soft:#9aa5bd;--line:#2c3550;--accent:#7fa6f0;--accent-ink:#0d1220;--warn:#f6b3a6}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
input,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;margin:4px 0 10px}
button,a.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:8px 14px;border-radius:10px;font:inherit;cursor:pointer;text-decoration:none;display:inline-block}
button.ghost{background:transparent;color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.meta{color:var(--soft);font-size:.9rem}
.err{color:var(--warn)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
<h1>Assignment orders · असाइनमेंट ऑर्डर</h1>

<form id="login" class="card">
  <p class="meta">Bridge admin login (the same account as your admin page). / ब्रिज एडमिन लॉगिन।</p>
  <label>Email<input id="em" type="email" autocomplete="username" required></label>
  <label>Password<input id="pw" type="password" autocomplete="current-password" required></label>
  <button type="submit">Login</button>
  <p id="lerr" class="err"></p>
</form>

<div id="app" hidden>
  <div class="row"><select id="flt" style="width:auto"><option value="">All</option><option value="new">new</option><option value="paid">paid</option><option value="in_progress">in_progress</option><option value="sent">sent</option></select><button class="ghost" id="reload" type="button">Reload</button><span class="sp"></span><button class="ghost" id="out" type="button">Logout</button></div>
  <div id="list"></div>
</div>
</div>
<script>
(() => {
"use strict";
const URL_ = "https://ovaubhekxjtkodkhsybg.supabase.co";
// public publishable key, the same one the Bridge Course store page uses; every read below is checked by row-level security
const KEY = "sb_publishable_LXYxPPuR4tX7vGyWg7NIyA_-F_ieSGW";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
let token = "";
try { token = sessionStorage.getItem("ao-token") || ""; } catch {}

async function api(path, opts = {}) {
  const r = await fetch(URL_ + path, { ...opts, headers: { apikey: KEY, Authorization: "Bearer " + token, "Content-Type": "application/json", ...(opts.headers || {}) } });
  if (r.status === 401) { token = ""; try { sessionStorage.removeItem("ao-token"); } catch {} show(); throw new Error("login"); }
  return r;
}
function show() { $("login").hidden = !!token; $("app").hidden = !token; }

$("login").addEventListener("submit", async e => {
  e.preventDefault(); $("lerr").textContent = "";
  const r = await fetch(URL_ + "/auth/v1/token?grant_type=password", { method: "POST", headers: { apikey: KEY, "Content-Type": "application/json" }, body: JSON.stringify({ email: $("em").value.trim(), password: $("pw").value }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok || !j.access_token) { $("lerr").textContent = "Login failed / लॉगिन नहीं हुआ."; return; }
  token = j.access_token; try { sessionStorage.setItem("ao-token", token); } catch {}
  $("pw").value = ""; show(); load();
});
$("out").onclick = () => { token = ""; try { sessionStorage.removeItem("ao-token"); } catch {} show(); };
$("reload").onclick = () => load();
$("flt").onchange = () => load();

function download(name, text) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿" + text], { type: "text/plain;charset=utf-8" }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

let rows = [];
async function load() {
  $("list").innerHTML = '<p class="meta">Loading…</p>';
  try {
    const f = $("flt").value ? `&status=eq.${$("flt").value}` : "";
    // the big form_text column is fetched only when a button is pressed
    const r = await api(`/rest/v1/assignment_orders?select=id,created_at,name,whatsapp,assignment_count,tasks,file_name,status&order=created_at.desc&limit=100${f}`);
    if (!r.ok) { $("list").innerHTML = '<p class="err">Could not load. This account may not be a Bridge admin, or the table is missing.</p>'; return; }
    rows = await r.json();
  } catch { return; }
  $("list").innerHTML = rows.length ? rows.map(o => `<div class="card" data-id="${o.id}">
    <div class="row"><strong>${esc(o.name || "(no name)")}</strong><span class="meta">${esc(o.whatsapp || "no WhatsApp")} · ${o.assignment_count} assignment(s) · ${new Date(o.created_at).toLocaleString()}</span></div>
    <p class="meta">${esc(o.tasks)}</p>
    <div class="row"><button type="button" data-dl="${o.id}">Download .txt</button>${o.whatsapp ? `<a class="btn ghost" target="_blank" rel="noopener" href="https://wa.me/91${esc(o.whatsapp)}">WhatsApp</a>` : ""}<span class="sp"></span>
    <select data-st="${o.id}" style="width:auto;margin:0">${["new", "paid", "in_progress", "sent"].map(s => `<option ${s === o.status ? "selected" : ""}>${s}</option>`).join("")}</select></div></div>`).join("") : '<p class="meta">No orders. / कोई ऑर्डर नहीं।</p>';
}
$("list").addEventListener("click", async e => {
  const b = e.target.closest("[data-dl]"); if (!b) return;
  const o = rows.find(x => String(x.id) === b.dataset.dl);
  b.disabled = true;
  try {
    const r = await api(`/rest/v1/assignment_orders?select=form_text&id=eq.${o.id}`);
    const j = await r.json();
    if (j[0]) download(o.file_name || `order_${o.id}.txt`, j[0].form_text);
  } catch {} finally { b.disabled = false; }
});
$("list").addEventListener("change", async e => {
  const s = e.target.closest("[data-st]"); if (!s) return;
  try { await api(`/rest/v1/assignment_orders?id=eq.${s.dataset.st}`, { method: "PATCH", body: JSON.stringify({ status: s.value }), headers: { Prefer: "return=minimal" } }); } catch {}
});
show(); if (token) load();
})();
</script>
</body>
</html>
