<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Bridge Course Assignment Form</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;700&display=swap">
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1d2433;--soft:#5b6478;--line:#dde2ec;--accent:#1f4fa3;--accent-ink:#fff;--accent-soft:#e5edfb;--warn:#a23b2a;--ok:#1e7a46;--ok-soft:#e3f4ea}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161f;--card:#1a2030;--ink:#e8ecf5;--soft:#9aa5bd;--line:#2c3550;--accent:#7fa6f0;--accent-ink:#0d1220;--accent-soft:#222c47;--warn:#f09a8a;--ok:#6fd09a;--ok-soft:#1b3326}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Mukta",system-ui,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 80px}
header{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;margin-bottom:12px}
h1{font-size:1.45rem;line-height:1.3;margin:0 0 4px}
.sub{color:var(--soft);margin:0;font-size:.95rem}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.lang button{border:0;background:transparent;color:var(--ink);padding:6px 14px;font:inherit;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
h2{font-size:1.1rem;margin:0 0 4px}
.hint{color:var(--soft);font-size:.9rem;margin:0 0 12px}
.f{margin:0 0 14px}
.f>label,.f>.lbl{display:block;font-weight:500;margin-bottom:4px}
.req::after{content:" *";color:var(--warn)}
body.testing .req::after{content:none}
input[type=text],input[type=tel],input[type=email],input[type=password],textarea,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:84px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:520px){.grid{grid-template-columns:1fr}}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.opt input{margin-top:5px}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.err{border-color:var(--warn)!important}
.taskbox{background:var(--accent-soft);border-radius:10px;padding:10px 12px;margin:8px 0 0;font-size:.92rem}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:10px 18px;border-radius:10px;font:inherit;font-weight:500;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{padding:6px 12px;font-size:.9rem}
.btn:disabled{opacity:.55;cursor:default}
.msg{padding:10px 12px;border-radius:10px;margin:10px 0}
.msg.bad{background:#fbe6e2;color:#7a2417}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .msg.bad{background:#3a1d18;color:#f6b3a6}}
.msg.good{background:var(--ok-soft);color:var(--ok)}
.hp{position:absolute;left:-9999px;height:0;overflow:hidden}
.demo{background:#fff4d6;color:#6a4b00;padding:6px 12px;border-radius:8px;font-size:.88rem;margin-bottom:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sub-card{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.sub-card h3{margin:0;font-size:1rem}
.chip{display:inline-block;font-size:.8rem;padding:1px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin-left:6px}
.chip.done{background:var(--ok-soft);color:var(--ok)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1 id="title"></h1>
    <p class="sub" id="subtitle"></p>
  </div>
  <div class="lang" role="group" aria-label="माध्यम / Medium"><button type="button" id="lhi">हिंदी</button><button type="button" id="len">English</button></div>
</header>

<main id="formView">
  <form id="f" autocomplete="on" novalidate></form>
</main>

</div>

<script>
(() => {
"use strict";
// ---------- settings ----------
const SCHEMA = "tettesthub-bridge-v1";
// Where a filled form is saved for the owner. If saving fails, the candidate gets the .txt to send on WhatsApp.
const INBOX_URL = "https://ovaubhekxjtkodkhsybg.supabase.co/rest/v1/assignment_orders";
// public (publishable) key, same one the Bridge Course store page uses; the table only accepts inserts from it
const INBOX_KEY = "sb_publishable_LXYxPPuR4tX7vGyWg7NIyA_-F_ieSGW";
// Razorpay Payment Link (Rakesh Pandey's Razorpay account), e.g. "https://rzp.io/l/xxxx". Leave "" to hide the Pay button.
const PAY_URL = "";
// WhatsApp number (country code + number, digits only) that receives the form. Submit opens a chat with it.
// NO_REQUIRED = true: no red stars and no required fields except choosing at least one assignment (owner request 2026-10-28).
const TESTING = true;
const WA_NUMBER = "919669776027";
const DRAFT = "bridge-form-draft-v1";

// ---------- question bank: every task has its own bilingual questions ----------
// q(hi, en, optional) text answer; ch(hi, en, "हिं|Eng; हिं|Eng", optional, multi) choice answer
const q = (hi, en, o) => ({ hi, en, o: !!o });
const ch = (hi, en, opts, o, multi) => ({ hi, en, o: !!o, multi: !!multi, opts: opts.split(";").map(s => { const [h, e] = s.trim().split("|"); return { hi: h, en: e || h }; }) });

const SUBJ = {
  hindi: ["हिंदी/क्षेत्रीय भाषा", "Hindi/regional language"],
  eng: ["अंग्रेज़ी", "English"],
  math: ["गणित", "Mathematics"],
  evs: ["परिवेश अध्ययन (EVS/TWAU)", "The World Around Us (EVS)"]
};

const docQs = (s, topicHi, topicEn) => [
  q(`${topicHi} के वे 3–4 मुख्य बिंदु लिखिए जो आपको सबसे ज़रूरी लगे।`, `Write the 3–4 main points of ${topicEn} that matter most to you.`),
  q(`इन बिंदुओं में से कौन-सा आपकी कक्षा के बच्चों के लिए सबसे उपयोगी है, और क्यों?`, `Which of these points is most useful for the children of your class, and why?`),
  q(`आपके विद्यालय/कक्षा का कोई उदाहरण जो इस विषय से जुड़ता है?`, `An example from your school or class that connects with this topic?`),
  q(`पहले आप ${s[0]} कैसे पढ़ाते थे और इन सुझावों के बाद क्या बदलना चाहेंगे?`, `How did you teach ${s[1]} earlier, and what would you change after these recommendations?`),
  q(`ज़मीनी स्तर पर कौन-सी चुनौतियाँ दिखती हैं?`, `What challenges do you see on the ground?`),
  q(`आपकी राय में इसका सबसे अच्छा पक्ष और एक कमी/अस्पष्टता क्या है?`, `In your view, what is its best aspect and one gap or unclear part?`, true)
];
const tbQs = (s, extra) => [
  q(`${s[0]} की पुस्तक का नाम, कक्षा और प्रकाशक?`, `Name, class and publisher of the ${s[1]} textbook?`),
  q(`कौन-से 1–2 पाठ/अध्याय ध्यान से देखे?`, `Which 1–2 lessons/chapters did you study closely?`),
  q(`भाषा कैसी है? बच्चे किन शब्दों/वाक्यों पर अटके?`, `How is the language? Which words or sentences did children get stuck on?`),
  ch(`चित्र बच्चों के परिवेश से कितने जुड़े हैं?`, `How well do the illustrations connect to the children's surroundings?`, "पूरी तरह स्थानीय परिवेश से|Fully local; कुछ जुड़े, कुछ अपरिचित|Partly; ज़्यादातर अपरिचित|Mostly unfamiliar"),
  q(`विषय-वस्तु का क्रम और अभ्यास प्रश्न कैसे हैं? (सरल से कठिन, मूर्त से अमूर्त)`, `How are the sequence of content and the exercises? (simple to difficult, concrete to abstract)`),
  q(`समावेशिता और रूढ़ियाँ: लड़के-लड़कियाँ, दिव्यांग, अलग समुदाय कैसे दिखाए गए हैं?`, `Inclusion and stereotypes: how are boys, girls, children with disabilities and different communities shown?`),
  ch(`पुस्तक में आकलन कैसा है?`, `How is assessment in the book?`, "विविध (मौखिक, चित्र, गतिविधि, लिखित)|Varied; ज़्यादातर लिखित/रटने वाला|Mostly written/rote; लगभग नहीं है|Almost absent"),
  ...extra,
  q(`आपके सुधार सुझाव?`, `Your suggestions for improvement?`, true)
];
const vdQs = (s, extra) => [
  q(`वीडियो का शीर्षक/विषय, कक्षा और अवधि?`, `Title or topic of the video, class and duration?`),
  q(`वीडियो में आपको क्या अच्छा लगा? मुख्य बातें लिखें।`, `What did you like in the video? Write the main points.`),
  ch(`भाषा और गति बच्चों की उम्र के अनुसार थी?`, `Were the language and pace right for the children's age?`, "हाँ, उपयुक्त|Yes, suitable; कुछ शब्द कठिन|Some words difficult; काफ़ी तेज़/कठिन|Too fast or difficult"),
  ch(`वीडियो कितना इंटरैक्टिव था?`, `How interactive was the video?`, "बीच-बीच में प्रश्न / गतिविधि|Questions and activities in between; थोड़ा|A little; केवल देखना|Only watching"),
  q(`उदाहरण आपके क्षेत्र/बच्चों से मेल खाते थे? क्या अलग लगा?`, `Did the examples match your area and children? What felt different?`),
  ...extra,
  q(`कक्षा में कितने बच्चों को, किस उपकरण पर दिखाया, और बच्चों ने क्या जवाब दिए?`, `How many children did you show it to, on which device, and what did they answer?`),
  q(`वीडियो की कमियाँ और सुधार सुझाव?`, `Weaknesses of the video and suggestions?`, true)
];
const ictQs = (s, extra) => [
  q(`कौन-सा संसाधन इस्तेमाल किया? (जादुई पिटारा की वस्तु / ऐप / वीडियो / गेम का नाम)`, `Which resource did you use? (name of the Jaadui Pitara item, app, video or game)`),
  q(`${s[0]} की कौन-सी अवधारणा/कौशल पढ़ाया और किस कक्षा में?`, `Which ${s[1]} concept or skill did you teach, and in which class?`),
  ch(`किस पर दिखाया/चलाया?`, `On what device did you run it?`, "स्मार्ट टीवी|Smart TV; मोबाइल|Mobile; प्रोजेक्टर|Projector; टैबलेट / कंप्यूटर|Tablet or computer"),
  q(`कक्षा में कैसे इस्तेमाल किया? मुख्य चरण लिखें।`, `How did you use it in class? Write the main steps.`),
  ...extra,
  q(`यह किस सीखने के प्रतिफल (Learning Outcome) से जुड़ता है?`, `Which learning outcome does it link to?`),
  q(`बच्चों की प्रतिक्रिया और परिणाम?`, `Children's response and the result?`),
  q(`बिजली/इंटरनेट/उपकरण की क्या दिक्कतें आईं?`, `What problems with electricity, internet or devices did you face?`, true)
];
const erQs = (s, extra) => [
  q(`कितने बच्चों की कॉपियाँ/वर्कशीट जाँचीं? किस टॉपिक की, कौन-सी कक्षा?`, `How many children's notebooks or worksheets did you check? Which topic and class?`),
  q(`मुख्य ${s[0]} गलतियाँ लिखिए, एक लाइन में एक। (प्रश्न = बच्चे का उत्तर, कितने बच्चों में)`, `List the main ${s[1]} errors, one per line. (question = child's answer, in how many children)`),
  ...extra,
  ch(`आपके हिसाब से गलतियों के कारण?`, `In your view, what are the causes of the errors?`, "अवधारणा स्पष्ट नहीं|Concept unclear; घर की भाषा/बोली का असर|Home language effect; अभ्यास की कमी|Lack of practice; ध्यान/रुचि की कमी|Lack of attention or interest; शिक्षण विधि|Teaching method", false, true),
  q(`उपचार के लिए कौन-सी गतिविधि/टीएलएम अपनाई? कितने दिन?`, `Which activity or TLM did you use as remedy? For how many days?`),
  q(`उपचार के बाद क्या बदलाव दिखा?`, `What change did you see after the remedy?`)
];
const wsQs = (s, extra) => [
  q(`वर्कशीट किस कक्षा और किस कौशल/अवधारणा के लिए बनाईं?`, `For which class and which skill or concept did you make the worksheets?`),
  q(`पाँचों वर्कशीट के नाम/विषय एक-एक लाइन में लिखिए।`, `List the name or topic of all five worksheets, one per line.`),
  ...extra,
  q(`बनाते समय किन बातों का ध्यान रखा? (भाषा, चित्र, स्थान, कठिनाई का क्रम)`, `What did you keep in mind while making them? (language, pictures, space, order of difficulty)`),
  q(`बच्चों से कैसे करवाईं और उनकी प्रतिक्रिया क्या रही?`, `How did you get children to do them, and how did they respond?`),
  q(`वर्कशीट से क्या सीखने के प्रमाण मिले?`, `What evidence of learning did the worksheets give?`),
  q(`किसी वर्कशीट में आगे क्या सुधार करेंगे?`, `What would you improve in any worksheet?`, true)
];
const tlmQs = (s, extra) => [
  q(`आपने क्या बनाया? किस कक्षा के लिए?`, `What did you make? For which class?`),
  q(`यह ${s[0]} के किस कौशल/अवधारणा के लिए है?`, `Which ${s[1]} skill or concept is it for?`),
  q(`किस सामान से बना और कुल लागत कितनी आई?`, `What was it made from and what was the total cost?`),
  q(`बनाने की विधि के मुख्य चरण?`, `Main steps of making it?`),
  ...extra,
  q(`कक्षा में इसका उपयोग कैसे किया? मुख्य चरण।`, `How did you use it in class? Main steps.`),
  q(`बच्चों की प्रतिक्रिया और क्या बदलाव दिखा?`, `Children's response and what change you saw?`),
  q(`इसमें आगे क्या सुधार करेंगे?`, `What would you improve next?`, true)
];
const plQs = (s, extra) => [
  q(`इकाई/गतिविधि का विषय और कक्षा?`, `Topic of the unit or activity, and class?`),
  q(`इस विषय से बच्चे कौन-से सीखने के प्रतिफल/दक्षताएँ पाएँगे?`, `Which learning outcomes or competencies will children gain?`),
  ...extra,
  q(`आपके पास कौन-सी सामग्री/संसाधन हैं?`, `What materials and resources do you have?`),
  q(`स्थानीय उदाहरण जो योजना में आएँगे? (त्योहार, खेल, गीत, कहानियाँ, फसलें)`, `Local examples to include? (festivals, games, songs, stories, crops)`),
  q(`आकलन कैसे करेंगे/किया?`, `How will you assess (or how did you)?`),
  q(`क्या यह कक्षा में करवाया? कैसा रहा?`, `Did you try it in class? How did it go?`, true)
];
const asQs = (s, extra) => [
  ...extra,
  q(`कितने बच्चों पर किया? (कूट नाम)`, `On how many children? (code names)`),
  q(`हर रणनीति/प्रश्न में बच्चों के उत्तर या मुख्य अवलोकन?`, `Children's answers or main observations for each strategy or question?`),
  q(`आकलन में क्या चुनौतियाँ आईं?`, `What challenges came up in assessment?`),
  q(`नतीजों के आधार पर आगे क्या करेंगे?`, `What will you do next on the basis of the results?`)
];
const H = SUBJ.hindi, E = SUBJ.eng, M = SUBJ.math, V = SUBJ.evs;
const BANK = {
  // ---------- Course 1 ----------
  c1t1: [
    q("आपने कितने बच्चों के साथ दिन बिताया? उन्हें कूट नाम दें और परिवार की आर्थिक स्थिति/पृष्ठभूमि बताएँ।", "With how many children did you spend the day? Give code names and each family's economic background."),
    q("दिन कब और कहाँ बिताया (विद्यालय, घर, बस्ती)? कितने घंटे?", "When and where did you spend the day (school, home, locality)? For how many hours?"),
    q("शारीरिक और भावनात्मक पहलू: स्वास्थ्य, भोजन, कपड़े, मूड, थकान में क्या दिखा?", "Physical and emotional factors: what did you see in health, food, clothes, mood and tiredness?"),
    q("सामाजिक, भाषाई, सांस्कृतिक और धार्मिक प्रभाव: घर की भाषा, त्योहार, रीति-रिवाज़ बच्चों के व्यवहार में कैसे दिखे?", "Social, language, cultural and religious influences: how did home language, festivals and customs show in the children's behaviour?"),
    q("कोई खास घटना या किसी बच्चे की कही हुई बात?", "Any special incident or something a child said?", true),
    q("अलग-अलग पृष्ठभूमि के बच्चों के सीखने में क्या अंतर दिखा?", "What difference did you see in learning between children of different backgrounds?"),
    q("इससे आप अपनी कक्षा में क्या बदलेंगे?", "What will you change in your class because of this?")
  ],
  c1t2: [
    q("किस बच्चे पर केस स्टडी की? (कूट नाम, कक्षा, उम्र, पारिवारिक पृष्ठभूमि)", "Which child is the case study on? (code name, class, age, family background)"),
    ch("मुख्य कठिनाई किस क्षेत्र में थी?", "In which area was the main difficulty?", "पढ़ना|Reading; लिखना|Writing; गणित|Mathematics; बोलना/समझना|Speaking or understanding; ध्यान/व्यवहार|Attention or behaviour; अन्य|Other", false, true),
    q("कठिनाई कैसे पहचानी? शुरुआती स्थिति का एक-दो उदाहरण दें।", "How did you identify the difficulty? Give one or two examples of the starting position."),

let lang = "hi";
let S = blank();
function blank() { return { profile: {}, sel: {}, open: "1-1", cls: "", total: "", locale: "", writeLang: "", ans: {}, refl: {}, consent: false }; }
// the 12 assignments: 6 courses x 2. In courses 3 to 6, assignment 1 is a Section A task and assignment 2 a Section B task
const SLOTS = []; for (let c = 1; c <= 6; c++) for (let a = 1; a <= 2; a++) SLOTS.push({ c, a, key: c + "-" + a });
try { const d = JSON.parse(localStorage.getItem(DRAFT)); if (d && d.S) { S = Object.assign(blank(), d.S); lang = d.lang || "hi"; } } catch {}
const saveDraft = () => { try { localStorage.setItem(DRAFT, JSON.stringify({ S, lang })); } catch {} };
const t = k => UI[k][lang === "hi" ? 0 : 1];
const L = p => lang === "hi" ? p.hi : p.en;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const taskById = id => DATA.tasks.find(x => x.id === id);
const secName = x => x.sec ? ((x.c === 3 ? (x.sec === "A" ? "खंड 1" : "खंड 2") : "Section " + x.sec) + " · ") : "";
function taskText(x) {
  if (lang === "hi") return x.short;
  const base = x.en ? x.en.replace(/\s+/g, " ") : EN_C3[x.id];
  const cut = base.length > 110 ? base.slice(0, 107) + "…" : base;
  return `${x.sec ? (x.c === 3 ? (x.sec === "A" ? "Section 1" : "Section 2") : "Section " + x.sec) + " · " : ""}Task ${x.n}: ${cut}`;
}
const ruleIdx = c => c <= 2 ? 0 : c === 3 ? 1 : 2;

// ---------- assignment slots ----------
const slotTasks = sl => DATA.tasks.filter(x => x.c === sl.c && (sl.c < 3 || x.sec === (sl.a === 1 ? "A" : "B")) && !SLOTS.some(o => o.key !== sl.key && S.sel[o.key] === x.id));
const chosenSlots = () => SLOTS.filter(sl => S.sel[sl.key]);
function slotHtml(sl, courses) {
  const tk = S.sel[sl.key] ? taskById(S.sel[sl.key]) : null, open = S.open === sl.key;
  const name = t("slotName").replace("{c}", sl.c).replace("{a}", sl.a);
  let h = `<div class="sub-card" data-slot="${sl.key}"><div class="row" style="justify-content:space-between"><h3>${name}<span class="chip ${tk ? "done" : ""}">${tk ? t("chosen") : t("notChosen")}</span></h3><button type="button" class="btn ghost small" data-open="${sl.key}" aria-label="${esc(name)}">${open ? "▲" : "▼"}</button></div>`;
  if (tk && !open) h += `<p class="hint" style="margin:6px 0 0">${esc(taskText(tk))}</p>`;
  if (open) {
    h += `<p class="hint" style="margin:6px 0 10px">Course ${sl.c}: ${esc(courses[sl.c])}</p><div class="f" data-q="slot_${sl.key}"><label for="task_${sl.key}">${t("task")}</label><select id="task_${sl.key}" data-slot-task="${sl.key}"><option value="">${t("pick")}</option>` +
      slotTasks(sl).map(x => `<option value="${x.id}" ${x.id === (tk && tk.id) ? "selected" : ""}>${esc(taskText(x))}</option>`).join("") + `</select>${tk && lang === "en" && tk.en ? `<div class="taskbox">${esc(tk.en)}</div>` : ""}</div>`;
    if (tk) {
      const nxt = SLOTS[SLOTS.indexOf(sl) + 1];
      h += `<p class="hint">${t("s4h")}</p>` + BANK[tk.id].map((qq, i) => qHtml(tk.id + "_", qq, i, S.ans)).join("") +
        `<div class="row"><button type="button" class="btn small" data-next="${sl.key}">${nxt ? t("nextBtn") : t("lastBtn")}</button></div>`;
    }
  }
  return h + `</div>`;
}
const slotMissing = sl => BANK[S.sel[sl.key]].map((qq, i) => [qq, S.sel[sl.key] + "_" + (i + 1)]).filter(([qq, id]) => !qq.o && !tick(S.ans[id])).map(([, id]) => id);

// ---------- render ----------
function fieldText(id, label, val, o, attrs) {
  return `<div class="f"><label class="${o ? "" : "req"}" for="${id}">${esc(label)}${o ? ` <span class="sub">${t("optional")}</span>` : ""}</label><input type="text" id="${id}" data-k="${id}" value="${esc(val)}" ${attrs || ""}></div>`;
}
function qHtml(prefix, qq, i, store) {
  const id = prefix + (i + 1);
  const label = L(qq);
  if (qq.opts) {
    const cur = store[id] || [];
    const type = qq.multi ? "checkbox" : "radio";
    return `<div class="f" data-q="${id}" data-req="${qq.o ? 0 : 1}"><div class="lbl ${qq.o ? "" : "req"}">${esc(label)}${qq.o ? ` <span class="sub">${t("optional")}</span>` : ""}</div><div class="opts">` +
      qq.opts.map((op, j) => `<label class="opt ${cur.includes(j) ? "on" : ""}"><input type="${type}" name="${id}" data-c="${id}" value="${j}" ${cur.includes(j) ? "checked" : ""}><span>${esc(L(op))}</span></label>`).join("") + `</div></div>`;
  }
  return `<div class="f" data-q="${id}" data-req="${qq.o ? 0 : 1}"><label class="${qq.o ? "" : "req"}" for="${id}">${esc(label)}${qq.o ? ` <span class="sub">${t("optional")}</span>` : ""}</label><textarea id="${id}" data-a="${id}">${esc(store[id] || "")}</textarea></div>`;
}
function render() {
  document.documentElement.lang = lang === "hi" ? "hi" : "en";
  $("title").textContent = t("title"); $("subtitle").textContent = t("subtitle");
  $("lhi").setAttribute("aria-pressed", lang === "hi"); $("len").setAttribute("aria-pressed", lang === "en");
  const tk = taskById(S.taskId);
  const cNo = +S.course || 0;
  const courses = lang === "hi" ? DATA.courseHi : DATA.courseEn;
  const rule = cNo ? UI.rule[ruleIdx(cNo)][lang === "hi" ? 0 : 1] : "";
  const clsOpts = [["कक्षा 1", "Class 1"], ["कक्षा 2", "Class 2"], ["कक्षा 3", "Class 3"], ["कक्षा 4", "Class 4"], ["कक्षा 5", "Class 5"], ["बहुकक्षा", "Multigrade"]];
  const wl = [["हिंदी", "Hindi"], ["English", "English"]];
  const radio = (name, list, cur) => `<div class="opts">` + list.map((o, j) => `<label class="opt ${String(cur) === String(j) ? "on" : ""}"><input type="radio" name="${name}" data-r="${name}" value="${j}" ${String(cur) === String(j) ? "checked" : ""}><span>${esc(o[lang === "hi" ? 0 : 1])}</span></label>`).join("") + `</div>`;
  let h = `<section><h2>${t("s1")}</h2><p class="hint">${t("s1h")}</p><div class="grid">` +
    PROFILE.map(([id, hi, en, o]) => fieldText("p_" + id, lang === "hi" ? hi : en, S.profile[id], o, id === "mobile" ? 'inputmode="tel"' : id === "email" ? 'inputmode="email"' : "")).join("") + `</div></section>`;
  h += `<section><h2>${t("s3")}</h2><div class="f" data-req="1" data-q="cls"><div class="lbl req">${t("cls")}</div>${radio("cls", clsOpts, S.cls)}</div>
    <div class="f" data-req="1" data-q="total"><label class="req" for="total">${t("total")}</label><input type="text" id="total" data-k="total" value="${esc(S.total)}"></div>
    <div class="f" data-req="1" data-q="locale"><label class="req" for="locale">${t("locale")}</label><textarea id="locale" data-k="locale">${esc(S.locale)}</textarea></div></section>`;
  h += `<section><h2>${t("sA")}</h2><p class="hint">${t("sAh")}</p>` + SLOTS.map(sl => slotHtml(sl, courses)).join("") + `<p class="hint" id="cnt" style="margin:10px 0 0">${t("count").replace("{n}", chosenSlots().length)}</p></section>`;
  h += `<section><h2>${t("s5")}</h2>` + REFLECT.map((qq, i) => qHtml("r_", qq, i, S.refl)).join("") +
    `<div class="f" data-req="1" data-q="writeLang"><div class="lbl req">${t("writeLang")}</div>${radio("writeLang", wl, S.writeLang)}</div></section>`;
  h += `<div class="hp" aria-hidden="true"><input type="text" id="hp" tabindex="-1" autocomplete="off"></div>
    <label class="opt ${S.consent ? "on" : ""}" style="margin:6px 0 12px" data-q="consent"><input type="checkbox" id="consent" ${S.consent ? "checked" : ""}><span>${t("consent")}</span></label>
    <div id="fmsg"></div><div class="row"><button class="btn" type="submit" id="sendBtn">${t("submit")}</button></div>
    <div class="row" style="margin-top:10px"><a class="btn ghost" id="waBtn" target="_blank" rel="noopener" style="text-decoration:none" href="https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(t("waHello"))}">${t("waAgain")}</a></div>`;
  $("f").innerHTML = h;
}

// ---------- events ----------
const f = $("f");
f.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.k) {
    if (el.id.startsWith("p_")) S.profile[el.dataset.k.slice(2)] = el.value;
    else S[el.dataset.k] = el.value;
  } else if (el.dataset.a) {
    (el.dataset.a.startsWith("r_") ? S.refl : S.ans)[el.dataset.a] = el.value;
  }
  el.closest(".f") && el.closest(".f").classList.remove("err");
  saveDraft();
});
f.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.slotTask) { const k = el.dataset.slotTask; if (el.value) S.sel[k] = el.value; else delete S.sel[k]; S.open = k; saveDraft(); render(); return; }
  if (el.id === "consent") { S.consent = el.checked; el.closest(".opt").classList.toggle("on", el.checked); saveDraft(); return; }
  if (el.dataset.r) {
    const v = el.value, n = el.dataset.r;
    if (n === "assignNo") S.assignNo = String(+v + 1); else S[n] = v;
    el.closest(".opts").querySelectorAll(".opt").forEach(o => o.classList.toggle("on", o.querySelector("input").checked));
    el.closest(".f").classList.remove("err"); saveDraft(); return;
  }
  if (el.dataset.c) {
    const id = el.dataset.c, store = id.startsWith("r_") ? S.refl : S.ans;
    const picked = [...f.querySelectorAll(`input[data-c="${id}"]`)].filter(x => x.checked).map(x => +x.value);
    store[id] = picked;
    el.closest(".opts").querySelectorAll(".opt").forEach(o => o.classList.toggle("on", o.querySelector("input").checked));
    el.closest(".f").classList.remove("err"); saveDraft();
  }
});
f.addEventListener("click", e => {
  const ob = e.target.closest("[data-open]"), nb = e.target.closest("[data-next]");
  const go = k => { S.open = k; saveDraft(); render(); const c = f.querySelector(k ? `[data-slot="${k}"]` : "#cnt"); if (c) c.scrollIntoView({ behavior: "smooth", block: "start" }); };
  if (ob) { go(S.open === ob.dataset.open ? "" : ob.dataset.open); return; }
  if (nb) {
    const sl = SLOTS.find(o => o.key === nb.dataset.next), bad = slotMissing(sl);
    if (bad.length) {
      bad.forEach(id => { const el = f.querySelector(`[data-q="${id}"]`); if (el) el.classList.add("err"); });
      const c = f.querySelector(`[data-slot="${sl.key}"]`); let m = c.querySelector(".msg"); if (!m) { m = document.createElement("div"); m.className = "msg bad"; nb.closest(".row").before(m); }
      m.textContent = t("fillSlot"); const first = c.querySelector(".err"); if (first) first.scrollIntoView({ behavior: "smooth", block: "center" });
      return;
    }
    const nxt = SLOTS[SLOTS.indexOf(sl) + 1]; go(nxt ? nxt.key : "");
  }
});
$("lhi").onclick = () => { lang = "hi"; saveDraft(); render(); };
$("len").onclick = () => { lang = "en"; saveDraft(); render(); };

// ---------- build + validate ----------
const tick = a => Array.isArray(a) ? a.length > 0 : !!(a && String(a).trim());
function missing() {
  const bad = [];
  if (TESTING) return chosenSlots().length ? [] : ["slots"];
  PROFILE.forEach(([id, , , o]) => { if (!o && !tick(S.profile[id])) bad.push("p_" + id); });
  if (tick(S.profile.whatsapp) && String(S.profile.whatsapp).replace(/\D/g, "").replace(/^(91|0)(?=\d{10}$)/, "").length !== 10 && !bad.includes("p_whatsapp")) bad.push("p_whatsapp");
  if (!chosenSlots().length) bad.push("slots");
  chosenSlots().forEach(sl => bad.push(...slotMissing(sl)));
  if (S.cls === "") bad.push("cls"); if (!tick(S.total)) bad.push("total"); if (!tick(S.locale)) bad.push("locale");
  REFLECT.forEach((qq, i) => { if (!qq.o && !tick(S.refl["r_" + (i + 1)])) bad.push("r_" + (i + 1)); });
  if (S.writeLang === "") bad.push("writeLang");
  return bad;
}
function answerText(qq, v) {
  if (qq.opts) return (v || []).map(j => (lang === "hi" ? qq.opts[j].hi : qq.opts[j].en)).join("; ");
  return String(v || "").trim();
}
function buildPayload() {
  const clsHi = ["कक्षा 1", "कक्षा 2", "कक्षा 3", "कक्षा 4", "कक्षा 5", "बहुकक्षा (Multigrade)"][+S.cls];
  const profile = {}; PROFILE.forEach(([id]) => { profile[id] = String(S.profile[id] || "").trim(); });
  profile.whatsapp = profile.whatsapp.replace(/\D/g, "").replace(/^(91|0)(?=\d{10}$)/, "");
  // one full form per chosen assignment; the assignment desk reads each ###BRIDGE-JSON### block as its own form
  return chosenSlots().map(sl => {
    const tk = taskById(S.sel[sl.key]);
    return {
      schema: SCHEMA, submittedAt: new Date().toISOString(), formLang: lang,
      profile, course: sl.c, taskId: tk.id, taskLabel: `${tk.n}. ${tk.short}`, assignNo: sl.a,
      cls: clsHi, total: S.total.trim(), locale: S.locale.trim(), writeLang: S.writeLang === "1" ? "English" : "हिंदी",
      qa: BANK[tk.id].map((qq, i) => ({ id: tk.id + "_" + (i + 1), q: qq.hi, qEn: qq.en, a: answerText(qq, S.ans[tk.id + "_" + (i + 1)]) })),
      reflection: REFLECT.map((qq, i) => ({ id: "r_" + (i + 1), q: qq.hi, qEn: qq.en, a: answerText(qq, S.refl["r_" + (i + 1)]) }))
    };
  });
}
const nowStamp = () => new Date().toISOString().slice(0, 10);
const fileName = list => `bridge_${(list[0].profile.name || "teacher").trim().replace(/\s+/g, "_")}_${list.length}assignments_${nowStamp()}.txt`;
// the text file reads like a normal note; one JSON block per assignment at the end lets the assignment desk load each with one click
function toText(list) {
  const p0 = list[0], hi = p0.formLang !== "en";
  const line = (k, v) => v ? `${k}: ${v}\n` : "";
  let o = `BRIDGE COURSE ASSIGNMENT: ${hi ? "शिक्षक की जानकारी" : "TEACHER INFORMATION"}\n${"=".repeat(46)}\n`;
  o += PROFILE.map(([id, h, e]) => line(hi ? h : e, p0.profile[id])).join("");
  o += `${hi ? "कक्षा" : "Class"}: ${p0.cls}\n${hi ? "कुल बच्चे" : "Total children"}: ${p0.total}\n${hi ? "परिवेश" : "Surroundings"}: ${p0.locale}\n${hi ? "लेखन माध्यम" : "Medium"}: ${p0.writeLang}\n`;
  o += `${hi ? "चुने गए असाइनमेंट" : "Assignments chosen"}: ${list.length}\n`;
  list.forEach((p, k) => {
    o += `\n\n${"=".repeat(46)}\n${k + 1}. Course ${p.course} · ${hi ? "असाइनमेंट" : "Assignment"} ${p.assignNo}\n${hi ? "कार्य" : "Task"}: ${p.taskLabel}\n${"-".repeat(46)}\n`;
    p.qa.forEach((x, i) => { o += `\n${i + 1}. ${hi ? x.q : x.qEn}\n   ${x.a || "—"}\n`; });
  });
  o += `\n\n${"=".repeat(46)}\n${hi ? "स्व-चिंतन" : "REFLECTION"}\n${"-".repeat(46)}\n`;
  p0.reflection.forEach((x, i) => { o += `\n${i + 1}. ${hi ? x.q : x.qEn}\n   ${x.a || "—"}\n`; });
  o += `\n\n${"=".repeat(46)}\n`;
  list.forEach(p => { o += `###BRIDGE-JSON-START###\n${JSON.stringify(p)}\n###BRIDGE-JSON-END###\n`; });
  return o;
}
async function download(name, text) {
  try {
    const d = window.claude && claude.use ? await claude.use("downloads") : null;
    if (d) { await d.save({ filename: name, data: "\ufeff" + text }); return; }
  } catch {}
  const blob = new Blob(["\ufeff" + text], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

f.addEventListener("submit", e => {
  e.preventDefault();
  if ($("hp").value) return;
  const bad = missing();
  const qb = bad.find(id => /^c\d/.test(id));
  if (qb && !f.querySelector(`[data-q="${qb}"]`)) { const sl = SLOTS.find(o => S.sel[o.key] === qb.split("_")[0]); if (sl) { S.open = sl.key; saveDraft(); render(); } }
  const msg = $("fmsg");
  f.querySelectorAll(".err").forEach(x => x.classList.remove("err"));
  if (bad.includes("slots")) { msg.innerHTML = `<div class="msg bad">${t("needOne")}</div>`; return; }
  if (bad.length) {
    bad.forEach(id => { const el = f.querySelector(`[data-q="${id}"]`) || (f.querySelector("#" + id) || {}).closest?.(".f"); if (el) el.classList.add("err"); });
    msg.innerHTML = `<div class="msg bad">${t("fillReq")}</div>`;
    const first = f.querySelector(".err"); if (first) first.scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }
  if (!S.consent) { msg.innerHTML = `<div class="msg bad">${t("needConsent")}</div>`; f.querySelector('[data-q="consent"]').classList.add("err"); return; }
  const list = buildPayload(), name = fileName(list), text = toText(list), p = list[0];
  const btn = $("sendBtn"); btn.disabled = true; btn.textContent = t("sending");
  const waText = t("waMsg").replace("{n}", list.length).replace("{name}", p.profile.name).replace("{wa}", p.profile.whatsapp);
  const waLink = `https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(waText)}`;
  const finish = async () => {
    let ok = false;
    try {
      // saved in the Supabase table assignment_orders (insert-only for the public; see supabase/migrations)
      const r = await fetch(INBOX_URL, { method: "POST", headers: { "Content-Type": "application/json", apikey: INBOX_KEY, Prefer: "return=minimal" }, body: JSON.stringify({ name: p.profile.name, whatsapp: p.profile.whatsapp, assignment_count: list.length, tasks: list.map(x => `C${x.course}-A${x.assignNo} ${x.taskId}`).join(", "), file_name: name, form_text: text }) });
      ok = r.ok;
    } catch {}
    if (ok) {
      try { localStorage.removeItem(DRAFT); } catch {}
      f.innerHTML = `<section><div class="msg good">${t("done")}</div><p>${t("thanks")}</p><div class="row"><a class="btn ghost" href="${esc(waLink)}" target="_blank" rel="noopener" style="text-decoration:none">${t("waAgain")}</a>${PAY_URL ? `<a class="btn" href="${esc(PAY_URL)}" target="_blank" rel="noopener" style="text-decoration:none">${t("pay")}</a>` : ""}<button type="button" class="btn ghost" id="again">${t("again")}</button></div></section>`;
    } else {
      download(name, text);
      f.innerHTML = `<section><div class="msg bad">${t("failed")}</div><p>${t("sendIt")}</p><p class="hint">${esc(name)}</p><div class="row"><button type="button" class="btn" id="cpy">${t("again2")}</button><button type="button" class="btn ghost" id="again">${t("again")}</button></div></section>`;
      $("cpy").onclick = () => download(name, text);
    }
    $("again").onclick = () => { S = blank(); saveDraft(); render(); window.scrollTo(0, 0); };
  };
  finish();
  window.scrollTo(0, 0);
});

if (TESTING) document.body.classList.add("testing");
render();
window.__form = { BANK, DATA, buildPayload, toText, S: () => S, SLOTS };
})();
</script>
</body>
</html>
