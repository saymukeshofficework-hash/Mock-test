    <!--
      Inlined as a data URI (rather than referencing public/images/decorative/favicon.svg)
      so the icon never needs a network fetch resolved against a path — this app is mounted
      under a sub-path whose depth changes with client-side routing, and some browsers
      re-resolve a relative <link rel="icon"> href against the current URL after history
      API navigation, which would 404 a few levels deep.
    -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%234d5fd1'/%3E%3Cstop offset='100%25' stop-color='%23db2777'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='%230f1440'/%3E%3Cpath d='M40 16a17 17 0 1 0 0 32 14 14 0 1 1 0-32z' fill='url(%23g)'/%3E%3Ccircle cx='47' cy='18' r='2.4' fill='%23f0dbb0'/%3E%3Ccircle cx='51' cy='26' r='1.4' fill='%23f0dbb0'/%3E%3Ccircle cx='44' cy='12' r='1.2' fill='%23f0dbb0'/%3E%3C/svg%3E"
    />

    <meta name="theme-color" content="#0f1440" />

      name="description"
