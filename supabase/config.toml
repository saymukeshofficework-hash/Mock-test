# Supabase CLI config for Bridge Course functions and the TETTESTHUB ca-push function.
# Bridge Course uses the configured project_id below; ca-push is deployed explicitly
# to the separate Current Affairs project with --project-ref znulepzdihzhjmuvyroi.
# Older SQL files were applied manually; never run `supabase db reset` against live projects. See docs/SUPABASE_SETUP.md.
project_id = "ovaubhekxjtkodkhsybg"

# All functions are called with the publishable key (sb_publishable_...), which is not a
# JWT, so the platform's JWT check must be off. Each function authorises requests in
# its own code (publishable-key gate, Razorpay signatures, hashed access tokens).
[functions.create-razorpay-order]
verify_jwt = false

[functions.verify-razorpay-payment]
verify_jwt = false

[functions.razorpay-webhook]
verify_jwt = false

[functions.create-download-link]
verify_jwt = false

[functions.order-status]
verify_jwt = false

[functions.tet-unlock]
verify_jwt = false

# Opt-in Web Push alerts for daily current affairs and newly added test papers.
[functions.ca-push]
verify_jwt = false
