<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bridge Course | TET Test Hub</title>
<meta name="description" content="Open the Bridge Course on TET Test Hub.">
<meta name="theme-color" content="#100d19">
<style>
:root{color-scheme:dark;--bg:#100d19;--panel:#211a30;--line:#49351d;--ink:#fffaf0;--muted:#d2c5b2;--accent:#fbbf24}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#493019 0%,var(--bg) 58%);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif}
header{position:sticky;top:0;background:#100d19ed;border-bottom:1px solid #49351d;padding:14px 18px}
.header-inner{max-width:900px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:900;letter-spacing:.3px}.brand span{color:var(--accent)}
.back{color:#fff;background:#382b1b;border:1px solid #654b28;border-radius:10px;padding:9px 13px;text-decoration:none;font-weight:750;font-size:13px}
main{max-width:900px;margin:0 auto;padding:32px 16px 80px}
.eyebrow{display:inline-block;color:#ffedb0;background:#3b2c16;border:1px solid #6a4c1b;border-radius:999px;padding:6px 10px;font-size:11px;font-weight:900;letter-spacing:.5px}
h1{font-size:clamp(26px,5vw,40px);margin:15px 0 8px;line-height:1.2}
.intro{color:var(--muted);margin:0 0 26px;line-height:1.7}
.grid{display:grid;grid-template-columns:minmax(0,520px);justify-content:center}
.card{display:flex;align-items:center;gap:16px;min-height:132px;padding:22px;border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:20px;background:linear-gradient(135deg,var(--panel),#352718);color:var(--ink);text-decoration:none;box-shadow:0 12px 30px #0003;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-3px);border-color:var(--accent)}
.icon{display:grid;place-items:center;flex:0 0 58px;height:58px;border-radius:17px;background:#493719;color:#fde68a;font-size:30px}
.card strong{display:block;font-size:18px;line-height:1.4}.card small{display:block;color:var(--muted);font-size:12px;line-height:1.6;margin-top:5px}
.arrow{margin-left:auto;color:var(--accent);font-size:30px}
@media(max-width:520px){main{padding-top:25px}.card{padding:16px;gap:11px;min-height:112px}.icon{flex-basis:46px;height:46px;font-size:24px}.card strong{font-size:15px}.card small{font-size:11px}}
</style>
</head>
<body>
<header><div class="header-inner"><div class="brand">TET <span>TEST HUB</span></div><a class="back" href="/index.html">← Home</a></div></header>
<main>
<span class="eyebrow">BRIDGE COURSE</span>
<h1>Bridge Course</h1>
<p class="intro">ब्रिज कोर्स खोलने के लिए नीचे दिए गए एकमात्र विकल्प पर टैप करें।</p>
<div class="grid">
<a class="card" href="/bridge-course/"><span class="icon" aria-hidden="true">🎓</span><span><strong>Bridge Course</strong><small>ब्रिज कोर्स खोलें और आगे बढ़ें</small></span><span class="arrow" aria-hidden="true">›</span></a>
</div>
</main>
</body>
</html>
