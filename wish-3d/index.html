<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a0e14">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Happy Diwali</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#0a0e14;color:#fff;font-family:-apple-system,'Segoe UI',Roboto,sans-serif;touch-action:manipulation;user-select:none}
  canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
  #fade{position:fixed;inset:0;background:#0a0e14;opacity:1;transition:opacity 1.6s ease;pointer-events:none;z-index:5}
  /* splash */
  #splash{position:fixed;inset:0;background:#0a0e14;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .9s ease}
  #splash.hide{opacity:0;pointer-events:none}
  .logo{width:46px;height:46px;border-radius:14px;background:#0f2a22;display:grid;place-items:center;box-shadow:0 0 24px rgba(40,160,110,.25);animation:sIn 1s .2s both}
  .logo svg{width:26px;height:26px}
  .sname{margin-top:18px;font-size:12px;letter-spacing:.03em;color:#e8ecef;animation:sIn 1s .5s both}
  .pres{margin-top:12px;font-size:8px;letter-spacing:.45em;color:#4b5560;animation:sIn 1s .9s both}
  .bar{margin-top:22px;width:70px;height:2px;background:#222a33;overflow:hidden;border-radius:2px}
  .bar i{display:block;height:100%;width:100%;background:#d99a3c;transform-origin:left;animation:load 2.4s ease-out forwards}
  @keyframes sIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes load{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  /* HUD */
  #hud{position:fixed;top:0;left:0;right:0;z-index:6;display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 14px) 16px 0;pointer-events:none;opacity:0;transition:opacity 1s}
  #hud.on{opacity:1}
  #hud .brand{display:flex;gap:7px;align-items:center;font-size:11px;color:#e6dccc;text-shadow:0 1px 6px #000}
  #hud .brand svg{width:14px;height:14px}
  #snd{position:absolute;right:16px;top:calc(env(safe-area-inset-top) + 8px);width:34px;height:34px;border-radius:50%;background:rgba(20,16,22,.45);border:0;color:#e6dccc;display:grid;place-items:center;pointer-events:auto;backdrop-filter:blur(6px)}
  #snd svg{width:16px;height:16px}
  /* tap hint */
  #tap{position:fixed;left:0;top:0;z-index:7;pointer-events:none;opacity:0;transition:opacity .6s;will-change:transform}
  #tap.on{opacity:1}
  #tap .pill{position:absolute;left:0;top:-74px;transform:translateX(-50%);display:flex;gap:7px;align-items:center;padding:8px 15px 8px 10px;border-radius:999px;font-size:12px;font-weight:600;color:#3a1c05;background:linear-gradient(90deg,#ffc77a 0%,#f0a03a 100%);box-shadow:0 0 22px rgba(255,160,40,.55),inset 0 0 0 1px rgba(255,255,255,.3);white-space:nowrap;overflow:hidden}
  #tap .pill::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.0),rgba(255,255,255,.55),rgba(255,255,255,0));transform:translateX(-100%);animation:sweep 1.8s ease-in-out infinite}
  #tap .pill svg{width:14px;height:14px}
  #tap .line{position:absolute;left:0;top:-40px;width:1px;height:40px;background:linear-gradient(#f6b24d,rgba(246,178,77,0));transform:translateX(-.5px)}
  #tap .ring{position:absolute;left:-26px;top:-26px;width:52px;height:52px;border-radius:50%;border:1.5px solid rgba(255,225,170,.85);box-shadow:0 0 14px rgba(255,190,90,.5)}
  #tap .ring::before{content:"";position:absolute;inset:-10px;border-radius:50%;border:1px solid rgba(255,225,170,.5);animation:ping 1.6s ease-out infinite}
  #tap .ring::after{content:"";position:absolute;inset:14px;border-radius:50%;background:radial-gradient(rgba(255,200,110,.8),rgba(255,160,40,0));animation:pulse 1.2s ease-in-out infinite alternate}
  @keyframes sweep{to{transform:translateX(100%)}}
  @keyframes ping{from{transform:scale(.7);opacity:1}to{transform:scale(1.5);opacity:0}}
  @keyframes pulse{from{opacity:.3;transform:scale(.7)}to{opacity:1;transform:scale(1.1)}}
  #hit{position:fixed;inset:0;z-index:6}
  /* final */
  #wish .msg{margin:0 auto 18px;max-width:520px;font-family:'Noto Sans Devanagari','Mukta','Kohinoor Devanagari','Nirmala UI',sans-serif;font-weight:700;font-size:clamp(17px,4.8vw,28px);line-height:1.55;color:#ffd98a;opacity:0;filter:blur(10px);transform:translateY(-10px);transition:opacity 2s ease,filter 2s ease,transform 2s ease;text-shadow:0 0 12px rgba(255,170,60,.85),0 0 30px rgba(255,110,10,.5),0 1px 0 rgba(90,40,5,.7)}
  #wish.on .msg{opacity:1;filter:none;transform:none}
  #wish{position:fixed;left:0;right:0;top:11%;z-index:7;text-align:center;pointer-events:none;padding:0 20px}
  #wish h1{font-family:'Palatino Linotype',Palatino,Georgia,serif;font-weight:800;font-size:clamp(38px,11vw,76px);letter-spacing:.01em;color:#fff2cf;opacity:0;filter:blur(18px);transform:scale(1.15);transition:opacity 2.2s ease,filter 2.2s ease,transform 2.2s ease;text-shadow:0 0 14px rgba(255,190,90,.9),0 0 38px rgba(255,130,20,.65),0 2px 0 rgba(120,60,10,.6)}
  #wish p{margin-top:8px;font-family:'Palatino Linotype',Palatino,Georgia,serif;font-weight:700;font-size:clamp(22px,6vw,40px);color:#f6a63a;opacity:0;filter:blur(10px);transition:opacity 2s .9s ease,filter 2s .9s ease;text-shadow:0 0 16px rgba(255,120,10,.8)}
  #wish.on h1,#wish.on p{opacity:1;filter:none;transform:none}
  #end{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 26px);z-index:8;display:flex;flex-direction:column;align-items:center;gap:16px;padding:0 22px;opacity:0;transform:translateY(20px);transition:all 1s ease;pointer-events:none}
  #end.on{opacity:1;transform:none;pointer-events:auto}
  #again{background:none;border:0;color:rgba(255,255,255,.65);font-size:13px;padding:6px 12px}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="fade"></div>
<div id="hit"></div>

<div id="splash">
  <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#7be0b0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg></div>
  <div class="sname">Diwali Wishes</div>
  <div class="pres">PRESENTS</div>
  <div class="bar"><i></i></div>
</div>

<div id="hud">
  <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="#e6dccc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/></svg>Diwali Wishes</div>
  <button id="snd" aria-label="Sound"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4z"/><path id="wave" d="M15.5 8.5a5 5 0 010 7M18.5 5.5a9 9 0 010 13"/></svg></button>
</div>

<div id="tap"><div class="line"></div><div class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="#3a1c05" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11V5a2 2 0 014 0v6"/><path d="M13 10a2 2 0 014 0v3a7 7 0 01-7 7h-1a5 5 0 01-4-2l-2-3a2 2 0 013-2l1 1"/></svg>Tap here</div><div class="ring"></div></div>

<div id="wish"><div class="msg">ऊर्जावान शिक्षक परिवार की ओर से<br>आप को दीपावली की हार्दिक शुभकामनाएं</div><h1>Happy Diwali</h1></div>
<div id="end"><button id="again">Watch again</button></div>

<script type="module">
import * as THREE from './three.module.min.js';

/* ------------------------------------------------------------ name */
function readName(){
  try{
    const seg = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop()||'');
    const cand = [location.hash.slice(1), new URLSearchParams(location.search).get('n'), /^[A-Za-z0-9+/=_-]{4,}$/.test(seg)&&!/\./.test(seg)?seg:''];
    for(const c of cand){ if(!c) continue;
      try{ const s = decodeURIComponent(escape(atob(c.replace(/-/g,'+').replace(/_/g,'/')))); if(s && /^[\p{L}\p{N} .'-]{1,24}$/u.test(s)) return s; }catch(e){}
    }
  }catch(e){}
  return 'Bulbul';
}
let NAME = readName();
const $ = id => document.getElementById(id);
const setFrom = () => {};
setFrom();

/* ------------------------------------------------------------ renderer */
const canvas = $('gl');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x1a1226, 0.011);
const camera = new THREE.PerspectiveCamera(58, 1, 0.1, 400);
function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w/h; camera.fov = w/h < 1 ? 58 : 44; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

/* ------------------------------------------------------------ textures */
function mkCanvas(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return [c,c.getContext('2d')]; }
function tex(c, srgb=true){ const t=new THREE.CanvasTexture(c); if(srgb) t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=4; return t; }
const glowTex = (()=>{ const [c,x]=mkCanvas(128,128); const g=x.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0,'rgba(255,240,200,1)'); g.addColorStop(.25,'rgba(255,190,90,.55)'); g.addColorStop(.6,'rgba(255,130,30,.15)'); g.addColorStop(1,'rgba(255,100,0,0)');
  x.fillStyle=g; x.fillRect(0,0,128,128); return tex(c); })();
const dotTex = (()=>{ const [c,x]=mkCanvas(64,64); const g=x.createRadialGradient(32,32,0,32,32,32);
  g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(.35,'rgba(255,255,255,.7)'); g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g; x.fillRect(0,0,64,64); return tex(c); })();
const flameTex = (()=>{ const [c,x]=mkCanvas(64,128);
  x.filter='blur(2.5px)';
  const g=x.createLinearGradient(0,120,0,6); g.addColorStop(0,'rgba(120,150,255,.0)'); g.addColorStop(.08,'rgba(255,255,235,1)'); g.addColorStop(.35,'rgba(255,225,130,1)'); g.addColorStop(.7,'rgba(255,150,30,.85)'); g.addColorStop(1,'rgba(255,90,0,0)');
  x.fillStyle=g; x.beginPath(); x.moveTo(32,6); x.bezierCurveTo(44,40,56,70,50,98); x.bezierCurveTo(46,118,18,118,14,98); x.bezierCurveTo(8,70,22,40,32,6); x.fill();
  return tex(c); })();

/* ground tiles */
const groundTex = (()=>{ const [c,x]=mkCanvas(256,256);
  x.fillStyle='#8a7a70'; x.fillRect(0,0,256,256);
  for(let i=0;i<1400;i++){ x.fillStyle=`rgba(${Math.random()<.5?'0,0,0':'255,230,210'},${Math.random()*.05})`; x.fillRect(Math.random()*256,Math.random()*256,2+Math.random()*4,2+Math.random()*4); }
  x.strokeStyle='rgba(30,22,28,.8)'; x.lineWidth=4; x.strokeRect(0,0,256,256);
  const t=tex(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(26,26); return t; })();

/* window texture */
function windowTex(){ const [c,x]=mkCanvas(128,192);
  const g=x.createLinearGradient(0,0,0,192); g.addColorStop(0,'#ffcf8a'); g.addColorStop(1,'#f0a24c');
  x.fillStyle='#2a1612'; x.fillRect(0,0,128,192);
  x.fillStyle=g; x.fillRect(8,8,112,176);
  x.fillStyle='#2a1612'; for(let i=1;i<7;i++) x.fillRect(8+i*14-2,8,4,176);
  x.fillRect(8,8+176/2-3,112,6);
  return tex(c); }
const winTex = windowTex();

/* ------------------------------------------------------------ sky */
const sky = (()=>{ const geo=new THREE.SphereGeometry(300,32,16); const cols=[]; const p=geo.attributes.position; const c=new THREE.Color();
  const stops=[[-.05,0x6e4a66],[.05,0x7d5778],[.22,0x3b2a5e],[.5,0x161338],[1,0x05040f]];
  for(let i=0;i<p.count;i++){ const h=p.getY(i)/300; let k=0; while(k<stops.length-2&&h>stops[k+1][0]) k++;
    const a=stops[k],b=stops[k+1]; const t=Math.min(1,Math.max(0,(h-a[0])/(b[0]-a[0]))); c.set(a[1]).lerp(new THREE.Color(b[1]),t); cols.push(c.r,c.g,c.b); }
  geo.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));
  const m=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.BackSide,fog:false,depthWrite:false})); m.renderOrder=-10; return m; })();
scene.add(sky);
const stars=(()=>{ const n=450,pos=[]; for(let i=0;i<n;i++){ const th=Math.random()*Math.PI*2, ph=Math.acos(.25+Math.random()*.75); const r=280; pos.push(r*Math.sin(ph)*Math.cos(th), r*Math.cos(ph), r*Math.sin(ph)*Math.sin(th)); }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  const p=new THREE.Points(g,new THREE.PointsMaterial({size:1.6,map:dotTex,transparent:true,depthWrite:false,fog:false,opacity:.0,color:0xfff0d0})); return p; })();
scene.add(stars);

/* ------------------------------------------------------------ lights */
const amb = new THREE.HemisphereLight(0xa88ab8, 0x3a2a30, 0.35); scene.add(amb);
const moon = new THREE.DirectionalLight(0x9a88c8, 0.25); moon.position.set(-10,20,10); scene.add(moon);
const warm = new THREE.PointLight(0xffa850, 0, 28, 1.6); warm.position.set(0,6,-4); scene.add(warm);
const mainLight = new THREE.PointLight(0xffa040, 0, 9, 1.8); scene.add(mainLight);

/* ------------------------------------------------------------ world */
const ground = new THREE.Mesh(new THREE.PlaneGeometry(220,220), new THREE.MeshLambertMaterial({map:groundTex,color:0xffffff}));
ground.rotation.x=-Math.PI/2; scene.add(ground);

const matWall = new THREE.MeshLambertMaterial({color:0xcdb095});
const matBase = new THREE.MeshLambertMaterial({color:0x6e2a26});
const matDark = new THREE.MeshLambertMaterial({color:0x3a1e1a});
const matRoof = new THREE.MeshLambertMaterial({color:0x8a5a48});
const matWin  = new THREE.MeshBasicMaterial({map:winTex,fog:true});
const matDoor = new THREE.MeshBasicMaterial({color:0xffe2b4});
function box(w,h,d,x,y,z,m){ const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m); b.position.set(x,y,z); scene.add(b); return b; }

const FZ = -14; // facade plane
// central tower
box(9,9,5, 0,4.5,FZ-2.5, matWall);
box(9.2,1.1,5.2, 0,9.5,FZ-2.5, matWall);           // parapet
box(9.6,.25,.5, 0,10.2,FZ+.1, matRoof);
box(5,1.4,4, 0,10.6,FZ-3, matWall);                 // stepped top
box(9.2,1.6,.15, 0,.8,FZ+.1, matBase);              // maroon base
// wings
for(const s of [-1,1]){
  box(11,7,5, s*9.5,3.5,FZ-2.5, matWall);
  box(11.2,.9,5.2, s*9.5,7.4,FZ-2.5, matWall);
  box(11.4,.25,.5, s*9.5,7.95,FZ+.1, matRoof);
  box(11.2,1.6,.15, s*9.5,.8,FZ+.1, matBase);
}
box(40,7,5, -29,3.5,FZ-2.5, matWall); box(40,7,5, 29,3.5,FZ-2.5, matWall);
// door
box(2.4,4.2,.3, 0,2.1,FZ+.05, matDark);
const door = new THREE.Mesh(new THREE.PlaneGeometry(1.7,3.6), matDoor); door.position.set(0,1.95,FZ+.25); scene.add(door);
for(const s of [-1,1]) box(.35,4.4,.45, s*1.3,2.2,FZ+.15, new THREE.MeshLambertMaterial({color:0x7a2e26}));
box(3.4,.5,1.3, 0,4.5,FZ+.6, new THREE.MeshLambertMaterial({color:0x8a3028})); // awning
// windows
function win(x,y,w=1.5,h=2.3){ const p=new THREE.Mesh(new THREE.PlaneGeometry(w,h),matWin); p.position.set(x,y,FZ+.12); scene.add(p); }
for(const x of [-14.5,-10.5,-6.5]) { win(x,2.6); }
for(const x of [14.5,10.5,6.5]) { win(x,2.6); }
for(const x of [-14.5,-10.5,-6.5,6.5,10.5,14.5]) win(x,5.3,1.5,2);
win(-17.5,2.6); win(17.5,2.6); win(-21,2.6); win(21,2.6);
for(const x of [-2.1,2.1]) { const d=new THREE.Mesh(new THREE.PlaneGeometry(1.4,2.8),matWin); d.position.set(x,6.6,FZ+.12); scene.add(d); }
win(-3.4,2.6,1.2,2); win(3.4,2.6,1.2,2);
// balcony
box(9.4,.3,1.6, 0,4.9,FZ+.8, matDark);
for(let i=0;i<=46;i++) box(.1,1.1,.1, -4.6+i*.2,5.55,FZ+1.5, matDark);
box(9.4,.12,.14, 0,6.15,FZ+1.5, matDark);
for(const s of [-1,1]) box(.3,4,.4, s*4.7,2.9,FZ+.9, matDark);
// distant silhouettes
for(const [x,z,h] of [[-48,-30,14],[44,-34,18],[-30,-45,20],[26,-50,16],[0,-70,22],[-70,-20,10],[70,-24,12]]) box(14,h,12,x,h/2,z,new THREE.MeshLambertMaterial({color:0x1b1424}));
// side walls to frame courtyard
box(1,5,60, -20,2.5,-6, matWall); box(1,5,60, 20,2.5,-6, matWall);
for(let i=0;i<14;i++){ box(.3,2.6,.3,-19.4,1.5,-34+i*4.3+2,matDark); }

/* string lights */
const bulbs=[]; // {x,y,z,d,seed}
function strand(x0,y0,x1,y1,z,sag=.35,step=.5){
  const n=Math.max(2,Math.round(Math.abs(x1-x0)/step));
  for(let i=0;i<=n;i++){ const t=i/n; bulbs.push({x:x0+(x1-x0)*t, y:y0+(y1-y0)*t - Math.sin(t*Math.PI)*sag, z, seed:Math.random()*6.28}); } }
function scallops(x0,x1,y,z,segs,sag){ const w=(x1-x0)/segs; for(let i=0;i<segs;i++) strand(x0+i*w,y,x0+(i+1)*w,y,z,sag,.45); }
scallops(-4.6,4.6,10.15,FZ+.45,6,.45);   // tower parapet
scallops(-4.6,4.6,6.9,FZ+.5,6,.5);
scallops(-15,-4.5,8.1,FZ+.45,8,.4); scallops(4.5,15,8.1,FZ+.45,8,.4);
scallops(-15,-4.5,4.1,FZ+.4,8,.4); scallops(4.5,15,4.1,FZ+.4,8,.4);
scallops(-27,-15,7.2,FZ+.4,8,.4); scallops(15,27,7.2,FZ+.4,8,.4);
scallops(-4.6,4.6,.9,FZ+.5,8,.2);
// frame lights around the door
strand(-1.2,.1,-1.2,4.2,FZ+.45,0,.35); strand(1.2,.1,1.2,4.2,FZ+.45,0,.35);
const bulbGeo=new THREE.BufferGeometry();
bulbGeo.setAttribute('position',new THREE.Float32BufferAttribute(bulbs.flatMap(b=>[b.x,b.y,b.z]),3));
const bulbCol=new Float32Array(bulbs.length*3); bulbGeo.setAttribute('color',new THREE.BufferAttribute(bulbCol,3));
const bulbPts=new THREE.Points(bulbGeo,new THREE.PointsMaterial({size:.55,map:glowTex,vertexColors:true,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending}));
scene.add(bulbPts);
for(const b of bulbs) b.d=Math.abs(b.x)*.06+Math.max(0,b.y)*.02;  // turn-on delay (center first, bottom first)

/* ------------------------------------------------------------ diyas */
const bowlGeo = (()=>{ const pts=[[0,0],[.22,0],[.38,.05],[.52,.16],[.6,.27],[.62,.31],[.56,.31],[.5,.25],[.36,.16],[.15,.13],[0,.13]].map(p=>new THREE.Vector2(p[0],p[1]));
  const g=new THREE.LatheGeometry(pts,20); g.computeVertexNormals(); return g; })();
const bowlMat = new THREE.MeshLambertMaterial({color:0xa4562e, side:THREE.DoubleSide});
const diyas=[];
function makeDiya(x,z,scale,litDelay,main=false){
  const g=new THREE.Group(); g.position.set(x,0,z); g.rotation.y=Math.random()*6.28;
  const m=new THREE.Mesh(bowlGeo,bowlMat); m.scale.setScalar(scale); g.add(m);
  const f=new THREE.Sprite(new THREE.SpriteMaterial({map:flameTex,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,fog:false}));
  f.center.set(.5,.05); f.position.set(0,.2*scale,0); f.scale.set(0,0,1); g.add(f);
  const gl=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,opacity:0,fog:false}));
  gl.position.set(0,.3*scale,0); gl.scale.setScalar(scale*(main?3.2:6)); g.add(gl);
  scene.add(g);
  const d={g,f,gl,scale,seed:Math.random()*100,delay:litDelay,main,k:0}; diyas.push(d); return d;
}

}
$('hit').addEventListener('pointerdown',onTap);
function reset(){
  location.hash = location.hash; // keep name
  diyas.forEach(d=>{ d.k=0; d.f.scale.set(0,0,1); d.gl.material.opacity=0; });
  lantern.visible=false; lantern.position.set(RG.x,.35,RG.z); rangoli.material.opacity=0; rangoli.scale.setScalar(.2);
  swarm.forEach(s=>s.s.material.opacity=0); fwLife.fill(0); fwCol.fill(0);
  $('wish').classList.remove('on'); $('end').classList.remove('on'); hideTap();
  S.tap1=S.tap2=S.tap3=-1; S.done=false; S.blessed=false; A.stage=0; A.padUntil=0; stopFwBed(); tracking=false;
  camPos.set(.8,.85,MAIN_Z+3.3); camLook.set(0,.3,MAIN_Z); tweenDur=0;
  begin();
}
$('again').addEventListener('click',reset);
window.addEventListener('hashchange',()=>{ NAME=readName(); setFrom(); });

/* splash → scene */
setTimeout(()=>{ $('splash').classList.add('hide'); begin(); },2900);

/* ------------------------------------------------------------ frame loop */
const clock=new THREE.Clock(); const tmpV=new THREE.Vector3();
function frame(){
  const dt=Math.min(.1,clock.getDelta()); S.t+=dt; const t=S.t;
  for(let i=Q.length-1;i>=0;i--) if(Q[i].at<=t){ const f=Q[i].fn; Q.splice(i,1); f(); }
  // lighting progression
  const L = S.tap1<0 ? 0 : sm(.8,6.5,t-S.tap1);
  amb.intensity=.3+.85*L; moon.intensity=.25+.3*L; warm.intensity=L*28; warm.position.set(0,5,-6);
  stars.material.opacity = clamp(.35+.4*L + (S.tap3>=0?.25:0),0,1);
  scene.fog.density = .012 - .004*L;
  const fogC=new THREE.Color(0x1a1226).lerp(new THREE.Color(0x5a4048),L*.6); scene.fog.color.copy(fogC);
  ground.material.color.setScalar(.45+.55*L);
  matWin.color.setScalar(.7+.3*Math.sin(t*2)*.05+.3*L);
  // diyas
  for(const d of diyas){
    const lt = d.main ? (S.tap1<0?-1:t-S.tap1) : (S.tap1<0?-1:t-S.tap1-1.1-d.delay);
    const k = lt<0?0:clamp(lt/(d.main?1.6:.7)); d.k=k;
    const fl = 1+.1*Math.sin(t*13+d.seed)+.07*Math.sin(t*27+d.seed*2);
    const w=d.scale*(d.main?.4:.55)*k*fl, h=d.scale*(d.main?1.2:1.5)*k*fl*(1+.06*Math.sin(t*9+d.seed));
    d.f.scale.set(w,h,1); d.f.material.rotation=0;
    d.gl.material.opacity = k*(d.main?.5:.8)*(.9+.1*fl);
  }
  mainLight.position.set(0,.8,MAIN_Z); mainLight.intensity = (S.tap1<0?0:clamp((t-S.tap1)/1.6))*(2.2+.4*Math.sin(t*15));
  // string lights
  for(let i=0;i<bulbs.length;i++){ const b=bulbs[i]; const k=S.tap1<0?0:clamp((t-S.tap1-2.2-b.d*2.2)/.5);
    const tw=.75+.25*Math.sin(t*3+b.seed*3); const v=k*tw; const c=bulbCol; c[i*3]=1.0*v; c[i*3+1]=.78*v; c[i*3+2]=.42*v; }
  bulbGeo.attributes.color.needsUpdate=true;
  // rangoli reveal
  if(S.tap2>=0){ const k=clamp((t-S.tap2)/3.2); const e=1-Math.pow(1-k,3); rangoli.material.opacity=Math.min(1,k*2); rangoli.scale.setScalar(.3+.7*e); rangoli.rotation.z=(1-e)*1.4; }
  // lantern
  if(lantern.visible){
    const core=lantern.getObjectByName('core'), halo=lantern.getObjectByName('halo'), body=lantern.getObjectByName('body');
    const pre=S.tap2<0?0:sm(1.6,4,t-S.tap2), launched=S.tap3>=0; const lt=launched?t-S.tap3:0;
    const glow = launched ? sm(0,2,lt) : pre*.35;
    body.material.color.setRGB(.9+.1*glow,.88-.18*glow,.8-.45*glow); core.material.opacity=glow*.95*(.93+.07*Math.sin(t*11)); halo.material.opacity=glow*.55;
    lantern.scale.setScalar(.6+.4*pre);
    if(launched){ const y=.35+Math.pow(lt,1.55)*2.1; lantern.position.set(Math.sin(lt*.7)*.7*Math.min(1,lt/3),y,RG.z-lt*.35); lantern.rotation.z=Math.sin(lt*.9)*.05; }
    else { lantern.position.y=.35+pre*.8+Math.sin(t*1.7)*.05*pre; }
  }
  // swarm
  if(S.tap3>=0){ const lt=t-S.tap3; for(const s of swarm){ const a=lt-4.5-s.delay; if(a<0){ continue; }
      const y=s.y+a*s.vy, x=s.x+Math.sin(a*.6+s.ph)*.9+a*s.dx; s.s.position.set(x,y,s.z-a*.3); s.s.material.opacity=sm(0,1.5,a)*(1-sm(26,34,y))*.95; } }
  // fireworks
  if(S.tap3>=0 && t>=S.fwNext){ const lt=t-S.tap3; const big=Math.random()<.3; const ang=rnd(-1,1);
    burst(ang*rnd(14,32), rnd(18,34), rnd(-48,-30), big?'big':(Math.random()<.35?'ring':(Math.random()<.4?'willow':'normal')));
    S.fwNext=t+(lt>9?rnd(.35,.8):rnd(.25,.7)); if(Math.random()<.5) burst(rnd(-30,30),rnd(14,32),rnd(-48,-30),'normal'); }
  fwUpdate(dt);
  // final text + buttons
  if(S.tap3>=0){ const lt=t-S.tap3; if(lt>5.2) setStage(4); if(lt>10.5 && !S.blessed){ S.blessed=true; $('wish').classList.add('on'); if(ac) sfx.bless(); } if(lt>15.5 && !S.done){ S.done=true; $('end').classList.add('on'); } }
  // camera
  if(tweenDur>0){ const k=ease(clamp((t-tweenT0)/tweenDur)); camPos.lerpVectors(tweenFrom.p,tweenTo.p,k); camLook.lerpVectors(tweenFrom.l,tweenTo.l,k); }
  if(tracking && S.tap3>=0){ const lt=t-S.tap3; const ty=lantern.position.y; camLook.lerp(tmpV.set(0,Math.max(2.2,ty*.8),RG.z),.06); if(lt>.1) tweenDur=0; }
  const sway=S.phase==='splash'||S.phase==='intro'?1:.5;
  camera.position.set(camPos.x+Math.sin(t*.5)*.05*sway,camPos.y+Math.sin(t*.7)*.04*sway,camPos.z);
  camera.lookAt(camLook);
  if(!tracking && tweenDur===0 && S.tap3>=0){ /* keep final framing */ }
  // tap hint follows world anchor
  if(tapEl.classList.contains('on')){ tmpV.copy(anchor).project(camera); const x=(tmpV.x*.5+.5)*innerWidth, y=(-tmpV.y*.5+.5)*innerHeight; tapEl.style.transform=`translate(${x}px,${y}px)`; }
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__d={tap:onTap,S,A,get ac(){return ac}};
</script>
